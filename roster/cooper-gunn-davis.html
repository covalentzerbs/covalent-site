    <style>

        /* CSS Variables */
        :root {
            /* One timing for every themed property, so nothing fades out of step. */
            --theme-transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease, -webkit-text-fill-color 300ms ease;
            --ice: #FAFBFC;
            --bond-blue: #5979e9;
            --black: #0A0A0A;
            --gray: #6B7280;
            /* Roster type: Bold Helvetica Neue, with a sane cross-platform fallback */
            --helv: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            --white: #FFFFFF;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        ::selection {
            background: var(--black);
            color: var(--white);
            -webkit-text-fill-color: var(--white);
        }

        html, body {
            height: 100%;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--white);
            pointer-events: none;
            z-index: 99999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
        }

        body {
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
            letter-spacing: -0.04em;
        }

        /* Navigation - Plus Menu */
        .nav {
            position: fixed;
            top: 0;
            right: 0;
            padding: 2rem;
            z-index: 10001;
        }

        /* Top-right nav: About and Contact stacked, small, in place of the old plus menu */
        .nav { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
        .nav-link {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--black);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .nav-link:hover, .nav-link.current { opacity: 1; }
        .nav-link:hover { color: #FF4500; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link { color: #FF4500 !important; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link:hover { color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF; }

        .menu-toggle {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-toggle.active {
            transform: rotate(45deg);
        }

        .plus-icon {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .plus-icon span {
            display: block;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--black);
            top: 50%;
            left: 0;
            transition: all 0.3s ease;
        }

        .plus-icon span:first-child {
            transform: translateY(-50%) rotate(90deg);
        }

        .plus-icon span:last-child {
            transform: translateY(-50%);
        }

        /* Expanded Menu */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 3rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .menu-overlay.active {
            pointer-events: auto;
            opacity: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.3);
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-link {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            color: var(--black);
            text-decoration: none;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.07em;
            line-height: 1.05;
        }

        .menu-overlay.active .menu-link {
            opacity: 0.6;
            transform: translateX(0);
        }

        .menu-overlay.active .menu-link:nth-child(1) { transition-delay: 0.05s; }
        .menu-overlay.active .menu-link:nth-child(2) { transition-delay: 0.1s; }
        .menu-overlay.active .menu-link:nth-child(3) { transition-delay: 0.15s; }
        .menu-overlay.active .menu-link:nth-child(4) { transition-delay: 0.25s; }
        .menu-overlay.active .menu-link:nth-child(5) { transition-delay: 0.3s; }

        

        .menu-socials {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-overlay.active .menu-socials {
            opacity: 0.5;
            transform: translateX(0);
            transition-delay: 0.3s;
        }




        .menu-link:hover {
            opacity: 1 !important;
        }

        .menu-link {
            position: relative;
            display: inline-block;
        }

        .menu-link-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #5979e9, #7B93FF, #5979e9, #3A5BD4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            opacity: 0;
            transition: opacity 0s;
        }

        .menu-link:hover .menu-link-gradient {
            opacity: 1;
        }

        .menu-link.current {
            opacity: 1 !important;
        }

        /* Logo Bottom Right */
        .logo-bottom {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .logo-bottom:hover { opacity: 1; }
        .logo-bottom:hover svg path { fill: #FF4500; }

        .logo-bottom svg {
            width: 40px;
            height: 40px;
        }

        .logo-bottom svg path {
            fill: var(--black); transition: fill 0.2s ease;
        }

        /* ==================== */
        /* CONTACT PAGE */
        /* ==================== */
        .contact-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .contact-email {
            font-size: clamp(2rem, 7vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.07em;
            line-height: 1.1;
            color: var(--bond-blue);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .contact-email:hover {
            opacity: 0.7;
        }

        /* Copy toast */
        .copy-toast {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--black);
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20000;
            white-space: nowrap;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ==================== */
        /* ==================== */
        /* GLOBAL FOOTER        */
        /* ==================== */
        .site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1001;
            opacity: 1;
        }
        .site-footer-left {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--black);
            opacity: 0.5;
        }
        .site-footer-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            opacity: 0.5;
        }
        .site-footer-socials {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .social-link {
            color: var(--black);
            display: flex;
            align-items: center;
        }

        /* ==================== */
        /* CLOCK */
        /* ==================== */
        .clock-widget {
            position: fixed;
            bottom: 5rem;
            right: 3rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.15rem;
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            /* Hidden until JS fills the times, then fade in -
               avoids a flash of the "--:--" placeholder. */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .clock-widget.ready {
            opacity: 1;
        }

        .clock-row {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--black);
            letter-spacing: -0.07em;
        }

        .clock-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.07em;
            min-width: 2rem;
            text-align: right;
        }

        .clock-time {
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .clock-colon {
            opacity: 1;
            transition: opacity 0.15s ease;
        }

        .clock-colon.blink {
            opacity: 0;
        }

        /* ==================== */
        /* RESPONSIVE */
        /* ==================== */
        @media (max-width: 1024px) {
            .nav {
                padding: 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

            .menu-overlay {
                padding: 6rem 2.5rem 2.5rem;
            }

            .clock-widget {
                bottom: 4.5rem;
                right: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .nav {
                padding: 1.5rem 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

            .logo-bottom svg {
                width: 32px;
                height: 32px;
            }

            .menu-overlay {
                padding: 5rem 1.5rem 1.5rem;
            }

            .roster-page {
                padding: 7rem 1.5rem 3rem;
            }

        }

        /* Hide dot cursor on touch devices */
        @media (pointer: coarse) {
            .cursor { display: none !important; }
            * { cursor: auto !important; }
        }
        /* ==================== */
        /* DARK MODE OVERRIDES */
        /* ==================== */
        body.dark-mode {
            background-color: #0A0A0A !important;
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode ::selection {
            background: #FF4500 !important;
            color: #0A0A0A !important;
            -webkit-text-fill-color: #0A0A0A !important;
        }

        body.dark-mode .cursor {
            background: #FF4500 !important;
        }

        body.dark-mode .plus-icon span {
            background: #FF4500 !important;
        }

        body.dark-mode .menu-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .logo-bottom svg path {
            fill: #FF4500 !important;
        }
        body.dark-mode .logo-bottom:hover svg path { fill: #FFFFFF !important; }

        body.dark-mode .social-link { color: #FF4500 !important; }
        body.dark-mode .site-footer-left { color: #FF4500 !important; -webkit-text-fill-color: #FF4500; }

        body.dark-mode .contact-email {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .clock-row {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .about-text {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-client {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-subtitle {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .scroll-progress-segment {
            background: #FF4500 !important;
        }

        body.dark-mode .director-name {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .director-credit {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link::after {
            background: #FF4500 !important;
        }

        body.dark-mode .hero-logo svg path {
            fill: #FF4500 !important;
        }

        /* ==================== */
        /* DARK MODE TOGGLE */
        /* ==================== */
        .dark-mode-toggle {
            cursor: none;
        }

        .dark-mode-toggle input {
            display: none;
        }

        .toggle-track {
            width: 28px;
            height: 16px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            position: relative;
            transition: background 0.3s ease;
            cursor: none;
            display: block;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode-toggle input:checked + .toggle-track {
            background: rgba(255, 69, 0, 0.8);
        }

        .dark-mode-toggle input:checked + .toggle-track::after {
            transform: translateX(12px);
            background: #FF4500;
        }
        /* SOCIAL ICON BRAND HOVER */
        /* SOCIAL ICON BRAND HOVER - high-saturation feedback */
        .social-link {
            transition: color 0.18s ease, opacity 0.18s ease, transform 0.18s ease, filter 0.18s ease;
            transform-origin: center;
        }
        .social-link[aria-label="Instagram"]:hover {
            color: #E1306C !important;
            opacity: 1 !important;
            transform: scale(1.22);
            filter: drop-shadow(0 0 10px rgba(225, 48, 108, 0.55)) saturate(1.4);
        }
        .social-link[aria-label="LinkedIn"]:hover {
            color: #0A66C2 !important;
            opacity: 1 !important;
            transform: scale(1.22);
            filter: drop-shadow(0 0 10px rgba(10, 102, 194, 0.6)) saturate(1.4);
        }
        .social-link.social-link-ionic:hover {
            color: #714BDD !important;
            opacity: 1 !important;
            transform: scale(1.22);
            filter: drop-shadow(0 0 10px rgba(113, 75, 221, 0.6)) saturate(1.4);
        }
        /* Lift the muted .menu-socials row so the hovered icon shows full color */
        .menu-overlay.active .menu-socials:hover { opacity: 1 !important; }
        /* BRANDED SCROLLBAR - replaces the native macOS overlay scrollbar
           with a thin Bond-Blue line on the right edge of the page. */
        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(89, 121, 233, 0.45) transparent;
        }
        html::-webkit-scrollbar {
            width: 6px;
        }
        html::-webkit-scrollbar-track {
            background: transparent;
        }
        html::-webkit-scrollbar-thumb {
            background: rgba(89, 121, 233, 0.35);
            border-radius: 3px;
            border: 1px solid transparent;
            background-clip: padding-box;
            transition: background-color 0.2s ease;
        }
        html::-webkit-scrollbar-thumb:hover {
            background: var(--bond-blue, #5979e9);
        }

        /* Dark mode: paint the root element so the canvas stays dark while
           scrolling. body height:100% means its background does not reach the
           canvas once the page scrolls, leaving the root white. */
        html:has(body.dark-mode) {
            background-color: #0A0A0A;
        }

        /* ==================== */
        /* CREATIVE ROSTER      */
        /* ==================== */
        /* Page scrolls, so the footer flows after the content instead of
           being pinned like the single-screen pages. */
        html, body { height: auto; min-height: 100%; }
        .site-footer { position: static; margin-top: 4rem; }

        .roster-page {
            width: 100%;
            /* full-bleed: every px of width buys a larger name before it wraps */
            padding: 9rem 2.5rem 4rem;
        }

        .roster-heading {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(2.5rem, 7vw, 5rem);
            letter-spacing: -0.035em;
            line-height: 0.95;
            text-transform: none;
            color: var(--black);
            margin-bottom: clamp(2.5rem, 6vw, 4.5rem);
        }

        /* ── 5 across x 3 down ── */
        .roster-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(2rem, 4vw, 3.75rem) clamp(0.9rem, 1.6vw, 1.75rem);
            align-items: start;
        }

        .roster-item {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .roster-name {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(1.25rem, 3.45vw, 4.75rem);
            letter-spacing: -0.04em;
            line-height: 0.92;
            /* names are proper nouns — never fold to the site-wide lowercase */
            text-transform: none;
            color: var(--black);
            opacity: 0.55;
            display: block;
            /* one line per name, always */
            white-space: nowrap;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .roster-item:hover .roster-name {
            opacity: 1;
            transform: translateX(3px);
        }

        /* Respect users who prefer no motion — keep the opacity cue, drop the slide. */
        @media (prefers-reduced-motion: reduce) {
            .roster-name { transition: opacity 0.25s ease; }
            .roster-item:hover .roster-name { transform: none; }
        }

        /* Touch devices get no hover — show names at full strength instead. */
        @media (pointer: coarse) {
            .roster-name { opacity: 1; }
        }

        /* Column count steps down so names always stay on one line.
           These must come after the base .roster-list rule to win the cascade. */
        @media (max-width: 900px) {
            .roster-list { grid-template-columns: repeat(2, 1fr); }
            .roster-name { font-size: clamp(1.1rem, 5.15vw, 3rem); }
        }
        /* Phones: one column, so every name stays on a single line at one
           consistent size. Spacing is pulled in tight so 16 names do not turn
           into an endless scroll. */
        @media (max-width: 600px) {
            .roster-page { padding: 5.5rem 1.25rem 2rem; }
            .roster-heading { margin-bottom: 1.5rem; }
            .roster-list {
                grid-template-columns: 1fr;
                gap: 0.35rem 0;
            }
            .roster-name { font-size: clamp(1.25rem, 7.6vw, 2.5rem); }
            .roster-disclaimer { margin-top: 2.25rem; }
        }

        /* ── Dark mode ── */
        /* ==================== */
        /* PASSWORD GATE        */
        /* ==================== */
        .gate {
            min-height: 55vh;
            display: flex;
            align-items: center;
        }

        .gate-form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
            width: min(100%, 340px);
        }

        .gate-label {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(1.75rem, 4vw, 3rem);
            letter-spacing: -0.035em;
            line-height: 1;
            text-transform: none;
            color: var(--black);
        }

        .gate-field {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            border-bottom: 2px solid rgba(0, 0, 0, 0.25);
            transition: border-color 0.2s ease;
        }

        .gate-field:focus-within {
            border-bottom-color: var(--black);
        }

        .gate-input {
            font-family: var(--helv);
            font-weight: 400;
            font-size: 1rem;
            /* near-normal tracking — the page-wide -0.07em is unreadable at input size */
            letter-spacing: 0;
            flex: 1 1 auto;
            min-width: 0;
            padding: 0.65rem 0;
            color: var(--black);
            background: transparent;
            border: none;
            border-radius: 0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .gate-toggle {
            flex: 0 0 auto;
            display: flex;
            align-items: center;

        .gate-toggle .gate-eye { display: block; }

        .gate-toggle.is-masked .gate-eye { display: none; }
        .gate-toggle.is-masked .gate-eye-off { display: block; }

        .gate-btn {

        .gate-error {

            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0;
            line-height: 1.5;

        body.dark-mode .gate-label,

            color: #0A0A0A !important;

        /* Mobile gate. Must come after the base .gate rules above to win the
           cascade — otherwise min-height/align-items fall back to desktop. */
        @media (max-width: 600px) {
            /* Footer is static on this page, so when the gate is short the page
               stops well before the fold and the footer floats mid-screen. Make
               the body fill the viewport and let main absorb the slack. */
            body {
                display: flex;
                flex-direction: column;
                min-height: 100svh;
            }
            .roster-page { flex: 1 0 auto; }
            .site-footer { margin-top: auto; }

            /* Locked only: centre the gate in the space main occupies. Scoped
               off .roster-unlocked so the 16-name list still flows from the top
               and scrolls normally once revealed. */
            body:not(.roster-unlocked) .roster-page {
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding-top: 2rem;
                padding-bottom: 2rem;

            body:not(.roster-unlocked) .gate {

                padding-top: 0;

                padding-top: 0.5rem;

            .gate-btn { padding: 0.8rem 1.5rem; }

            .gate-toggle { padding: 0.5rem; }
        }

        /* Fine print. Regular weight rather than the bold used for the names,
           and normal tracking — the page-wide -0.07em is far too tight at this size. */
        .roster-disclaimer {

            font-weight: 400;

            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }





        /* Footer link inherits footer colour (kills default visited-link purple) */
        .footer-link, .footer-link:link, .footer-link:visited { color: inherit; }

        /* ==================== */
        /* DIRECTOR REEL        */
        /* ==================== */
        /* Tight edges - the work should own as much of the page as possible. */
        .director-page { padding: 7rem 1.5rem 3rem; }

        .director-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;

        .director-name {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(2.5rem, 7vw, 5rem);
            letter-spacing: -0.035em;
            line-height: 0.95;
            text-transform: none;
            color: var(--black);
        }

        .director-back {
            font-family: var(--helv);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: -0.02em;
            text-decoration: none;
            color: var(--black);
            opacity: 0.45;
            transition: opacity 0.25s ease;
        }

        .director-back:hover { opacity: 1; }

        /* Three across, 5px apart. Every tile is the same 16:9 window so the
           grid reads as one block no matter what the source ratio is. */
        .reel-grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .reel-media {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            margin: 0;
            padding: 0;
            border: 0;
            background: #ECECEC;
            color: inherit;
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .reel-thumb {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Verticals are letterboxed rather than cropped to a sliver. Black,
           not grey, so the bars match the ones the Vimeo player draws on hover
           and the tile does not read as a hole in the mosaic. */
        .reel-media.is-portrait { background: #000; }
        .reel-media.is-portrait .reel-thumb { object-fit: cover; }   /* previews always fill the window */

        /* The player is sized to the clip's own aspect ratio (--va) and enlarged
           until it covers the 16:9 window, so 4:3 and square clips fill the tile
           instead of sitting in bars. The viewer shows them at their true shape. */
        .reel-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            width: max(100%, calc(100% * 0.5625 * var(--va, 1.778)));
            height: max(100%, calc(100% * 1.7778 / var(--va, 1.778)));
            transform: translate(-50%, -50%) scale(1.02);
            border: 0;
            opacity: 0;
            transition: none;   /* the player is already running: a hover is a cut */
            pointer-events: none;
        }

        /* The thumbnail stays put underneath the iframe - fading it out first
           would flash the empty tile while the player boots. */
        .reel-media.is-playing .reel-frame { opacity: 1; }

        /* Title left, client right, on one line under the video. */
        .reel-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            margin-top: 5px;
        }

        .reel-title,
        .reel-client {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(0.7rem, 0.75vw, 0.85rem);
            letter-spacing: 0.01em;
            line-height: 1.25;
            text-transform: uppercase;
            color: var(--black);
        }

        .reel-title { flex: 1 1 auto; min-width: 0; }
        .reel-client { flex: 0 0 auto; text-align: right; }

        @media (max-width: 900px) {
            .reel-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .director-page { padding: 5.5rem 1rem 2rem; }
            .director-top { margin-bottom: 1rem; }
            .reel-grid { grid-template-columns: 1fr; gap: 5px; }
            .reel-title, .reel-client { font-size: 0.72rem; }
        }

        body.dark-mode .director-name,
        body.dark-mode .director-back,
        body.dark-mode .reel-title,
        body.dark-mode .reel-client {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .reel-media { background: #1A1A1A; }

        /* Theme switch: a short cross-fade instead of a hard cut. The class is
           only on <body> for the duration of the fade, so it never fights the
           site's own transitions the rest of the time. */
        body.theme-fading,
        body.theme-fading *,
        body.theme-fading *::before,
        body.theme-fading *::after {
            transition: var(--theme-transition) !important;
        }
        /* ── Work Viewer ──────────────────────────────────── */
        .work-viewer { position:fixed; inset:0; z-index:1005; background:#000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
        .work-viewer.active { opacity:1; pointer-events:all; }
        .viewer-frame { position:relative; width:90vw; max-width:calc(90vh * 16 / 9); height:calc(90vw * 9 / 16); max-height:90vh; }
        .viewer-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
        .viewer-video-hero { position:absolute; inset:0; }
        .viewer-click-layer { position:absolute; inset:0; z-index:2; }
        .viewer-center-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.7); width:84px; height:84px; border-radius:50%; background:rgba(0,0,0,0.42); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; z-index:4; }
        .viewer-center-icon .cc-ic { width:38px; height:38px; display:none; }

        .viewer-controls { position:absolute; left:0; right:0; bottom:0; padding:48px 96px 16px 20px; display:flex; align-items:center; gap:10px; background:linear-gradient(transparent,rgba(0,0,0,0.6)); z-index:3; transition:opacity .3s ease,transform .3s ease; }
        .viewer-fs-corner { position:absolute; bottom:14px; right:18px; z-index:5; background:none; border:none; cursor:none; padding:6px; opacity:0.65; transition:opacity 0.2s ease; line-height:0; }
        .viewer-fs-corner:hover { opacity:1; }
        /* volume control: corner button left of the expand button, with a pop-up gauge */
        .viewer-vol { position:absolute; bottom:14px; right:54px; z-index:5; display:flex; align-items:center; justify-content:center; line-height:0; transition:opacity 0.3s ease; }
        .viewer-vol-btn { background:none; border:none; cursor:none; padding:6px; opacity:0.65; transition:opacity 0.2s ease; line-height:0; }
        .viewer-vol-btn:hover { opacity:1; }
        .viewer-vol-btn .vol-ic { display:none; }
        .viewer-vol-btn .vol-on { display:block; }
        .viewer-vol.muted .vol-on { display:none; }
        .viewer-vol.muted .vol-off { display:block; }
        .viewer-vol-gauge { position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); opacity:0; pointer-events:none; transition:opacity 0.18s ease; background:rgba(20,20,20,0.72); border-radius:999px; padding:12px 0; }
        .viewer-vol.show-gauge .viewer-vol-gauge { opacity:1; pointer-events:auto; }

        .viewer-vol-fill { position:absolute; left:0; right:0; bottom:0; height:0%; background:#fff; border-radius:999px; }
        .viewer-video-hero.cs-playing .viewer-controls { opacity:0; transform:translateY(6px); pointer-events:none; }
        .viewer-video-hero.cs-playing.cs-hover .viewer-controls { opacity:1; transform:translateY(0); pointer-events:auto; }
        /* corner buttons (volume + expand) fade out with the controls when the video isn't being hovered */
        .viewer-video-hero.cs-playing ~ .viewer-fs-corner, .viewer-video-hero.cs-playing ~ .viewer-vol { opacity:0; pointer-events:none; }
        .viewer-video-hero.cs-playing.cs-hover ~ .viewer-fs-corner { opacity:0.65; pointer-events:auto; }
        .viewer-video-hero.cs-playing.cs-hover ~ .viewer-vol { opacity:1; pointer-events:auto; }
        .viewer-ctrl-btn { background:none; border:none; padding:4px 6px; flex-shrink:0; cursor:none; }
        .viewer-ctrl-btn .cs-ctrl-icon { display:none; width:14px; height:14px; object-fit:contain; }
        .viewer-ctrl-btn .cs-icon-play { display:block; }
        .viewer-video-hero.cs-playing .viewer-ctrl-btn .cs-icon-play { display:none; }
        .viewer-video-hero.cs-playing .viewer-ctrl-btn .cs-icon-pause { display:block; }
        .viewer-progress { flex:1; padding:8px 0; cursor:none; position:relative; }
        .viewer-progress .cs-progress-track { width:100%; height:2px; background:rgba(255,255,255,0.3); border-radius:999px; position:relative; overflow:hidden; transition:height 0.15s ease; }
        .viewer-progress .cs-progress-fill { position:absolute; left:0; top:0; bottom:0; width:0%; background:#fff; border-radius:999px; }
        .viewer-progress .cs-progress-thumb { position:absolute; top:50%; left:0; width:11px; height:11px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); opacity:0; transition:opacity 0.15s ease; pointer-events:none; box-shadow:0 1px 5px rgba(0,0,0,0.5); }
        .viewer-progress:hover .cs-progress-thumb, .viewer-progress.dragging .cs-progress-thumb { opacity:1; }
        .viewer-progress:hover .cs-progress-track, .viewer-progress.dragging .cs-progress-track { height:4px; }
        /* scrubber frame preview (mini player seeked to the cursor time) */
        .scrub-preview { position:absolute; bottom:calc(100% + 14px); left:0; transform:translateX(-50%); width:168px; opacity:0; pointer-events:none; transition:opacity 0.12s ease; z-index:6; }
        .scrub-preview.show { opacity:1; }
        .scrub-preview-frame { width:168px; height:95px; border-radius:6px; overflow:hidden; background:#000; box-shadow:0 10px 34px rgba(0,0,0,0.55); position:relative; }
        .scrub-preview-frame iframe { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:100%; min-width:169px; min-height:95px; border:none; pointer-events:none; }
        .scrub-preview-time { display:block; text-align:center; margin-top:5px; font-size:11px; color:#fff; font-family:'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif; letter-spacing:-0.03em; text-shadow:0 1px 3px rgba(0,0,0,0.65); }
        .viewer-time { font-size:11px; color:rgba(255,255,255,0.7); white-space:nowrap; font-family:'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif; letter-spacing:-0.04em; }
        .viewer-close { position:absolute; top:1.5rem; right:1.5rem; z-index:10; background:none; border:none; cursor:none; padding:0.5rem; opacity:0.5; transition:opacity 0.2s; line-height:0; }
        .viewer-close:hover { opacity:1; }
        .viewer-meta { position:absolute; bottom:2rem; left:3rem; display:none; flex-direction:column; gap:0.2rem; pointer-events:none; }

        .viewer-nav { display:none; position:absolute; top:50%; transform:translateY(-50%); background:none; border:none; cursor:none; padding:1.2rem; opacity:0.4; transition:opacity 0.2s; line-height:0; }
        .viewer-nav:hover { opacity:1; }
        .viewer-prev { left:0.5rem; }

        /* viewer open: hide page chrome (menu +) and the corner close; clicking the margin closes */
        body.viewer-open .nav { opacity:0 !important; pointer-events:none !important; }

            will-change:transform,left,top,opacity; }
        #viewerExitCursor.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

    <script>
        // ==================== //
        // CUSTOM CURSOR
        // ==================== //
        const cursor = document.getElementById('cursor');
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            cursor.style.display = 'none';
        }

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.35;
            cursorY += (mouseY - cursorY) * 0.35;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // ==================== //
        // MENU TOGGLE
        // ==================== //
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        menuToggle && menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        menuOverlay && menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (menuOverlay && menuOverlay.classList.contains('active'))) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // ==================== //
        // MENU LINK GRADIENT SPREAD EFFECT
        // ==================== //
        // (menu hover handled by CSS only)

        // ==================== //
        // VIRUS SPREADING TEXT EFFECT (footer)
        // ==================== //
        const virusLinks = document.querySelectorAll('.footer-link');

        virusLinks.forEach(link => {
            const text = link.textContent;
            link.textContent = '';

            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const char = document.createElement('span');
                char.className = 'char';
                char.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                link.appendChild(char);
                chars.push(char);
            }

            let isInfected = false;

            link.addEventListener('mouseenter', (e) => {
                if (isInfected) return;
                isInfected = true;

                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => a.distance - b.distance);

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.add('infected');
                        if (i === charDistances.length - 1) {
                            link.classList.add('fully-infected');
                        }
                    }, i * 30);
                });
            });

            link.addEventListener('mouseleave', (e) => {
                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => b.distance - a.distance);
                link.classList.remove('fully-infected');

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.remove('infected');
                        if (i === charDistances.length - 1) {
                            isInfected = false;
                        }
                    }, i * 25);
                });
            });
        });
    </script>

                document.body.classList.add('dark-mode');

            toggle.addEventListener('change', () => {

                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });

            // Cursor inflate on toggle hover
            const cursorEl = document.getElementById('cursor');
            const toggleLabel = document.querySelector('.dark-mode-toggle');
            toggleLabel.addEventListener('mouseenter', () => {
                cursorEl.style.transform = 'translate(-50%, -50%) scale(1.8)';
                cursorEl.style.transition = 'transform 0.2s ease, left 0s, top 0s';
            });
            toggleLabel.addEventListener('mouseleave', () => {
                cursorEl.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorEl.style.transition = 'transform 0.2s ease, left 0s, top 0s';
            });
        })();

    <script>
    // Roster unlock. The page ships only ciphertext; the password derives the
    // AES key, so nothing is revealed by view-source or a plain fetch.
    (function () {
        var form    = document.getElementById('gateForm');
        var input   = document.getElementById('gatePassword');
        var btn     = document.getElementById('gateBtn');
        var errorEl = document.getElementById('gateError');
        var gate    = document.getElementById('gate');
        var target  = document.getElementById('rosterContent');
        var payload = JSON.parse(document.getElementById('rosterPayload').textContent);
        var KEY     = 'covalent.roster.pw';

        function b64(s) {
            var bin = atob(s), out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        async function decrypt(password) {
            var base = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            var key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64(payload.s), iterations: payload.n, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            var plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: b64(payload.i) }, key, b64(payload.c));
            return new TextDecoder().decode(plain);
        }

        function reveal(html) {
            target.innerHTML = html;
            target.hidden = false;
            gate.remove();
            document.body.classList.add('roster-unlocked');
        }

        async function attempt(password, fromStore) {
            try {
                reveal(await decrypt(password));
                try { sessionStorage.setItem(KEY, password); } catch (e) {}
                return true;
            } catch (e) {
                // a bad password fails the GCM auth tag and lands here
                if (!fromStore) {
                    errorEl.textContent = 'Incorrect password.';
                    input.value = '';
                    input.focus();
                }
                try { if (fromStore) sessionStorage.removeItem(KEY); } catch (e2) {}
                return false;
            }
        }

        // Web Crypto needs a secure context (https or localhost).
        if (!window.crypto || !crypto.subtle) {
            errorEl.textContent = 'This page needs a secure (https) connection.';
            if (btn) btn.disabled = true;
            return;
        }

        // stay unlocked while the tab is open
        var saved = null;
        try { saved = sessionStorage.getItem(KEY); } catch (e) {}
        if (saved) attempt(saved, true);

        // Password starts visible; this masks it. Caret position is preserved so
        // toggling mid-typing does not jump the cursor to the end.
        var toggle = document.getElementById('gateToggle');
        toggle.addEventListener('click', function () {
            var wasMasked = input.type === 'password';
            var start = input.selectionStart, end = input.selectionEnd;
            var nowMasked = !wasMasked;
            input.type = nowMasked ? 'password' : 'text';
            toggle.classList.toggle('is-masked', nowMasked);
            toggle.setAttribute('aria-pressed', nowMasked ? 'true' : 'false');
            var lbl = nowMasked ? 'Show password' : 'Hide password';
            toggle.setAttribute('aria-label', lbl);
            toggle.setAttribute('title', lbl);
            input.focus();
            try { input.setSelectionRange(start, end); } catch (err) {}
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var pw = input.value;
            if (!pw) return;
            errorEl.textContent = '';
            btn.disabled = true;
            await attempt(pw, false);
            btn.disabled = false;
        });
    })();
    </script>

    <script>
    // ===== Work Viewer (ported from the editor profile pages) =====
    var openViewer;
    (function initWorkViewer() {
        // The viewer plays whichever tile was clicked; items are read from the
        // grid at open time, so gated pages (tiles arrive after the unlock) work too.
        var viewerItems = [];
        function collectItems() {
            return Array.prototype.map.call(document.querySelectorAll('.reel-item'), function (li) {
                var m = li.querySelector('.reel-media');
                return { vimeo: m.getAttribute('data-vimeo'), hash: m.getAttribute('data-hash') || '', va: parseFloat(m.getAttribute('data-va')) || 1.778,
                         client: (li.querySelector('.reel-client') || {}).textContent || '',
                         title: (li.querySelector('.reel-title') || {}).textContent || '' };
            });
        }
        var viewer   = document.getElementById('workViewer');
        var frame    = document.getElementById('viewerFrame');
        var vHero    = document.getElementById('viewerVideoHero');
        var iframe   = document.getElementById('viewerIframe');
        var clientEl = document.getElementById('viewerClient');
        var titleEl  = document.getElementById('viewerTitleText');
        var closeBtn = document.getElementById('viewerClose');
        var prevBtn  = document.getElementById('viewerPrev');
        var nextBtn  = document.getElementById('viewerNext');
        var ppBtn    = document.getElementById('viewerPlayPause');
        var progEl   = document.getElementById('viewerProgress');
        var fillEl   = document.getElementById('viewerFill');
        var thumb    = document.getElementById('viewerThumb');
        var timeEl   = document.getElementById('viewerTime');
        var fsBtn    = document.getElementById('viewerFsBtn');
        var clickLayer = document.getElementById('viewerClickLayer');
        var current = -1, vPlayer = null, vDuration = 0, vPlaying = false, idleTimer = null, dragging = false, vVolume = 1, vMuted = false, volDragging = false;
        // EXIT cursor: knockout "EXIT" label shown over the margin around the video
        var exitCur = document.createElement('div');
        exitCur.id='viewerExitCursor'; exitCur.setAttribute('aria-hidden','true');
        (function(){ var w=Math.round('EXIT'.length*8.6+28), h=26;
            exitCur.innerHTML='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><defs><mask id="exitCurMask"><rect width="'+w+'" height="'+h+'" rx="5" fill="#fff"/><text x="'+(w/2)+'" y="14" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="-0.2" fill="#000">EXIT</text></mask></defs><rect width="'+w+'" height="'+h+'" rx="5" fill="#fff" mask="url(#exitCurMask)"/></svg>';
        })();
        document.body.appendChild(exitCur);
        function ptrInsideFrame(e){ var r=frame.getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; }
        viewer.addEventListener('mousemove', function(e){
            if(!viewer.classList.contains('active')) return;
            var overNav = e.target && e.target.closest && e.target.closest('.viewer-nav');
            if(ptrInsideFrame(e) || overNav){ exitCur.classList.remove('show'); document.body.classList.remove('viewer-exit-active'); }
            else { exitCur.style.left=e.clientX+'px'; exitCur.style.top=e.clientY+'px'; exitCur.classList.add('show'); document.body.classList.add('viewer-exit-active'); }
        }, {passive:true});
        function fmt(s) { var m=Math.floor(s/60),sec=Math.floor(s%60); return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
        function setPlaying(p) { vPlaying=p; vHero.classList.toggle('cs-playing',p); if(ppBtn) ppBtn.setAttribute('data-cursor', p?'pause':'play'); }
        function resetPlayer() {
            if (vPlayer) { try { vPlayer.destroy(); } catch(e){} vPlayer=null; }
            var stray=vHero.querySelector('iframe'); if(stray) stray.remove();
            vPlaying=false; vDuration=0;
            vHero.classList.remove('cs-playing','cs-hover');
            if (fillEl) fillEl.style.width='0%';
            if (thumb) thumb.style.left='0%';
            if (timeEl) timeEl.textContent='00:00 / 00:00';
            hidePrev(); teardownPrev();
        }
        function bindPlayer(p) {
            p.getDuration().then(function(d){ vDuration=d; if(timeEl&&d) timeEl.textContent='00:00 / '+fmt(d); }).catch(function(){});
            p.on('play',  function(){ setPlaying(true); });
            p.on('pause', function(){ setPlaying(false); });
            p.on('ended', function(){ setPlaying(false); });
            p.on('timeupdate', function(data){ if(!vDuration||!fillEl||dragging)return; var pc=data.seconds/vDuration*100; fillEl.style.width=pc+'%'; if(thumb) thumb.style.left=pc+'%'; if(timeEl) timeEl.textContent=fmt(data.seconds)+' / '+fmt(vDuration); });
        }
        function whenVimeoReady(cb){
            if(window.Vimeo){ cb(); return; }
            var n=0; (function poll(){ if(window.Vimeo) return cb(); if(n++>120) return; setTimeout(poll,50); })();
        }
        openViewer = function(idx) { viewerItems=collectItems(); vMuted=false; if(vVolume===0) vVolume=1; renderVol();
            current=idx; var item=viewerItems[idx];
            resetPlayer();
            // Build a fresh iframe each open — Vimeo's player.destroy() removes the
            // iframe from the DOM, so reusing one breaks every reopen (the prod bug).
            iframe=document.createElement('iframe');
            iframe.id='viewerIframe';
            iframe.setAttribute('frameborder','0');
            iframe.setAttribute('allow','autoplay; fullscreen; picture-in-picture');
            iframe.setAttribute('allowfullscreen','');
            iframe.src='https://player.vimeo.com/video/'+item.vimeo+'?'+(item.hash?'h='+item.hash+'&':'')+'autoplay=1&muted=0&controls=0&dnt=1&playsinline=1';
            vHero.insertBefore(iframe, vHero.firstChild);
            // the viewer frame takes the clip's true shape: as large as fits, no crop
            frame.style.width='min(90vw, calc(90vh * '+(item.va||1.778)+'))'; frame.style.height='min(90vh, calc(90vw / '+(item.va||1.778)+'))';
            frame.style.maxWidth='none'; frame.style.maxHeight='none';
            clientEl.textContent=item.client||''; titleEl.textContent=item.title||'';
            viewer.classList.add('active'); document.body.classList.add('viewer-open'); document.body.classList.remove('click-cursor-active'); document.body.style.overflow='hidden';
            prevBtn.style.opacity=idx>0?'0.6':'0.15';
            nextBtn.style.opacity=idx<viewerItems.length-1?'0.6':'0.15';
            // Bind the player as soon as the SDK is ready — don't depend on iframe.onload
            // (the onload+SDK race is what left the controls dead in production).
            whenVimeoReady(function(){
                try{
                    vPlayer=new Vimeo.Player(iframe);
                    bindPlayer(vPlayer);
                    vPlayer.ready().then(function(){ vPlayer.play().catch(function(){}); applyVol(); }).catch(function(){});
                }catch(e){}
            });
        };
        function closeViewer() {
            viewer.classList.remove('active');
            document.body.classList.remove('viewer-open','viewer-exit-active');
            if(exitCur) exitCur.classList.remove('show');
            clearTimeout(idleTimer); resetPlayer();
            document.body.style.overflow='';
        }
        var centerIcon=document.getElementById('viewerCenterIcon');
        function flashCenter(playing){ if(!centerIcon)return; centerIcon.classList.remove('flash','show-play','show-pause'); void centerIcon.offsetWidth; centerIcon.classList.add(playing?'show-play':'show-pause','flash'); }
        function togglePlay(flash) { if(!vPlayer)return; var willPlay=!vPlaying; if(vPlaying) vPlayer.pause(); else vPlayer.play(); if(flash) flashCenter(willPlay); }
        clickLayer.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(true); });
        ppBtn.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(false); });
        // scrubber: click + drag with a visible thumb that tracks the cursor
        function scrubPct(e){ var r=progEl.getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); }
        function scrubPreview(p){ if(fillEl) fillEl.style.width=(p*100)+'%'; if(thumb) thumb.style.left=(p*100)+'%'; if(timeEl&&vDuration) timeEl.textContent=fmt(p*vDuration)+' / '+fmt(vDuration); }
        // frame preview: a 2nd hidden Vimeo player seeked to the cursor time (Vimeo is
        // cross-origin, so a seeked mini-player is the only way to show the actual frame)
        var scrubPrev=document.getElementById('scrubPreview'), scrubPrevFrame=document.getElementById('scrubPreviewFrame'), scrubPrevTime=document.getElementById('scrubPreviewTime');
        var prevPlayer=null, prevReady=false, prevVimeo=null, prevSeeking=false, prevPending=null;
        function teardownPrev(){ if(prevPlayer){ try{prevPlayer.destroy();}catch(e){} } prevPlayer=null; prevReady=false; prevVimeo=null; prevSeeking=false; prevPending=null; if(scrubPrevFrame) scrubPrevFrame.innerHTML=''; }
        function buildPrev(){
            var item=viewerItems[current]; if(!item||!item.vimeo||!scrubPrevFrame) return;
            if(prevVimeo===item.vimeo && prevPlayer) return;
            teardownPrev(); prevVimeo=item.vimeo;
            var pf=document.createElement('iframe'); pf.setAttribute('frameborder','0'); pf.setAttribute('allow','autoplay');
            pf.src='https://player.vimeo.com/video/'+item.vimeo+'?'+(item.hash?'h='+item.hash+'&':'')+'background=1&muted=1&controls=0&dnt=1';
            scrubPrevFrame.appendChild(pf);
            whenVimeoReady(function(){ try{ prevPlayer=new Vimeo.Player(pf); prevPlayer.ready().then(function(){ prevReady=true; if(prevPending!=null){ var t=prevPending; prevPending=null; seekPrev(t); } }).catch(function(){}); }catch(e){} });
        }
        function seekPrev(t){
            if(!prevReady||!prevPlayer){ prevPending=t; return; }
            if(prevSeeking){ prevPending=t; return; }
            prevSeeking=true;
            prevPlayer.setCurrentTime(t).then(function(){ prevSeeking=false; if(prevPending!=null){ var n=prevPending; prevPending=null; seekPrev(n); } }).catch(function(){ prevSeeking=false; });
        }
        function showPrev(e){
            if(!vDuration||!scrubPrev) return;
            buildPrev();
            var p=scrubPct(e), r=progEl.getBoundingClientRect();
            scrubPrev.style.left=Math.max(84, Math.min(r.width-84, e.clientX-r.left))+'px';
            if(scrubPrevTime) scrubPrevTime.textContent=fmt(p*vDuration);
            scrubPrev.classList.add('show');
            seekPrev(p*vDuration);
        }
        function hidePrev(){ if(scrubPrev) scrubPrev.classList.remove('show'); }
        progEl.addEventListener('mousedown', function(e){
            if(!vPlayer||!vDuration)return;
            e.preventDefault(); e.stopPropagation();
            dragging=true; progEl.classList.add('dragging'); scrubPreview(scrubPct(e)); showPrev(e);
        });
        progEl.addEventListener('mousemove', function(e){ if(!dragging) showPrev(e); }, {passive:true});
        progEl.addEventListener('mouseleave', function(){ if(!dragging) hidePrev(); }, {passive:true});
        document.addEventListener('mousemove', function(e){ if(dragging){ scrubPreview(scrubPct(e)); showPrev(e); } }, {passive:true});
        document.addEventListener('mouseup', function(e){
            if(!dragging)return;
            dragging=false; progEl.classList.remove('dragging');
            var p=scrubPct(e); if(vPlayer&&vDuration) vPlayer.setCurrentTime(p*vDuration).catch(function(){});
            hidePrev();
        });
        fsBtn.addEventListener('click', function(e){
            e.stopPropagation();
            var target=frame||viewer;
            if(document.fullscreenElement) document.exitFullscreen().catch(function(){});
            else target.requestFullscreen().catch(function(){});
        });
        // fullscreen: hide cursor + controls + expand button after 1s of no movement
        var fsIdleTimer=null;
        function inFs(){ return document.fullscreenElement||document.webkitFullscreenElement; }
        function fsIdleHide(){ if(inFs()) frame.classList.add('fs-idle'); }
        function fsPoke(){ if(fsIdleTimer)clearTimeout(fsIdleTimer); frame.classList.remove('fs-idle'); if(inFs()) fsIdleTimer=setTimeout(fsIdleHide,1000); }
        function fsLeave(){ frame.classList.remove('fs-idle'); if(fsIdleTimer){clearTimeout(fsIdleTimer);fsIdleTimer=null;} }
        document.addEventListener('mousemove', function(){ if(inFs()) fsPoke(); }, {passive:true});
        document.addEventListener('fullscreenchange', function(){ inFs()?fsPoke():fsLeave(); });
        document.addEventListener('webkitfullscreenchange', function(){ inFs()?fsPoke():fsLeave(); });
        // volume: mute toggle + draggable gauge (videos autoplay muted, so this is how sound comes on)
        var volWrap=document.getElementById('viewerVol'), volBtn=document.getElementById('viewerVolBtn'),
            volTrack=document.getElementById('viewerVolTrack'), volFill=document.getElementById('viewerVolFill'), volHideT=null;
        function renderVol(){ var off=(vMuted||vVolume===0); volWrap.classList.toggle('muted',off); volFill.style.height=((off?0:vVolume)*100)+'%'; volBtn.setAttribute('data-cursor',off?'unmute':'mute'); }
        function applyVol(){ if(!vPlayer)return; var off=(vMuted||vVolume===0); try{ if(vPlayer.setMuted) vPlayer.setMuted(off); }catch(e){} try{ vPlayer.setVolume(off?0:vVolume).catch(function(){}); }catch(e){} renderVol(); }
        function showGauge(){ clearTimeout(volHideT); volWrap.classList.add('show-gauge'); }
        function hideGaugeSoon(){ clearTimeout(volHideT); volHideT=setTimeout(function(){ if(!volDragging) volWrap.classList.remove('show-gauge'); },500); }
        function volFromY(e){ var r=volTrack.getBoundingClientRect(); return Math.max(0,Math.min(1, 1-(e.clientY-r.top)/r.height)); }
        volBtn.addEventListener('click', function(e){ e.stopPropagation(); vMuted=!vMuted; if(!vMuted&&vVolume===0) vVolume=1; applyVol(); showGauge(); });
        volWrap.addEventListener('mouseenter', showGauge);
        volWrap.addEventListener('mouseleave', hideGaugeSoon);
        volTrack.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); volDragging=true; var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); });
        document.addEventListener('mousemove', function(e){ if(volDragging){ var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); } }, {passive:true});
        document.addEventListener('mouseup', function(){ volDragging=false; });
        renderVol();
        // Keep the controls + corner buttons alive while the cursor is anywhere in the
        // frame (incl. the volume/expand buttons, which are siblings of the video-hero).
        // Don't auto-hide while the volume gauge is open or being dragged.
        function csIdleHide(){ if(!volWrap.classList.contains('show-gauge') && !volDragging) vHero.classList.remove('cs-hover'); }
        function csPoke(){ vHero.classList.add('cs-hover'); clearTimeout(idleTimer); if(vPlaying) idleTimer=setTimeout(csIdleHide,2000); }
        frame.addEventListener('mouseenter', csPoke);
        frame.addEventListener('mousemove',  csPoke);
        frame.addEventListener('mouseleave', function(){ vHero.classList.remove('cs-hover'); clearTimeout(idleTimer); });
        if(closeBtn) closeBtn.addEventListener('click',closeViewer);
        // click anywhere outside the video bounds closes (the EXIT cursor signals this)
        viewer.addEventListener('click',function(e){
            if(!viewer.classList.contains('active'))return;
            if(e.target && e.target.closest && e.target.closest('.viewer-nav')) return;
            if(!ptrInsideFrame(e)) closeViewer();
        });
        prevBtn.addEventListener('click',function(e){e.stopPropagation();if(current>0)openViewer(current-1);});
        nextBtn.addEventListener('click',function(e){e.stopPropagation();if(current<viewerItems.length-1)openViewer(current+1);});
        document.addEventListener('keydown',function(e){
            if(!viewer.classList.contains('active'))return;
            if(e.key==='Escape')closeViewer();
            if(e.key==='ArrowLeft'&&current>0)openViewer(current-1);
            if(e.key==='ArrowRight'&&current<viewerItems.length-1)openViewer(current+1);
            if(e.key===' '){e.preventDefault();togglePlay(true);}
            if(e.key==='m'||e.key==='M'){vMuted=!vMuted;if(!vMuted&&vVolume===0)vVolume=1;applyVol();showGauge();}
        });
    })();
    </script>

    <script>
    // Reel playback. Every tile's player is created paused as the tile scrolls
    // into view (a few at a time), so hovering a tile plays a player that is
    // already loaded: no wait. One clip plays at a time.
    (function () {
        var playing = null, warmQueue = [], warming = false;

        function post(frame, method) {
            try { frame.contentWindow.postMessage(JSON.stringify({ method: method }), '*'); } catch (e) {}
        }

        function frameOf(media) { return media.querySelector('.reel-frame'); }

        function build(media, autoplay) {
            var id = media.getAttribute('data-vimeo');
            if (!id) return null;
            var hash = media.getAttribute('data-hash');   // unlisted videos carry one
            var frame = document.createElement('iframe');
            frame.className = 'reel-frame';
            frame.src = 'https://player.vimeo.com/video/' + id +
                        '?background=1&autoplay=' + (autoplay ? 1 : 0) + '&loop=1&muted=1&dnt=1&quality=540p' +
                        (hash ? '&h=' + hash : '');
            frame.setAttribute('frameborder', '0');
            frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
            frame.setAttribute('tabindex', '-1');
            frame.setAttribute('aria-hidden', 'true');
            frame.title = '';
            frame.style.setProperty('--va', media.getAttribute('data-va') || '1.778');
            frame.addEventListener('load', function () {
                frame.dataset.loaded = '1';
                // background=1 starts on its own; hold it until it is hovered
                post(frame, media === playing ? 'play' : 'pause');
            });
            media.appendChild(frame);
            return frame;
        }

        // warm one tile at a time so they do not all fight for the same connections
        function warm(media) {
            if (frameOf(media) || warmQueue.indexOf(media) !== -1) return;
            warmQueue.push(media);
            if (!warming) drain();
        }
        function drain() {
            var media = warmQueue.shift();
            if (!media) { warming = false; return; }
            warming = true;
            if (!frameOf(media)) build(media, false);
            setTimeout(drain, 250);
        }

        function reload(frame) {
            frame.dataset.reloaded = '1';
            frame.src = frame.src.replace('autoplay=0', 'autoplay=1');
        }

        function stop() {
            if (!playing) return;
            var frame = frameOf(playing);
            if (frame) post(frame, 'pause');
            playing.classList.remove('is-playing');
            playing = null;
        }

        function play(media) {
            if (media === playing) return;
            stop();
            var frame = frameOf(media);
            if (!frame) frame = build(media, true);      // not warmed yet: load it already playing
            else if (frame.dataset.loaded) post(frame, 'play');
            if (!frame) return;
            media.classList.add('is-playing');
            playing = media;
            // A warm player that will not start from a pause gets reloaded playing.
            // Asked after a beat: asking the instant after "play" reports paused
            // (play is async) and the reload made the clip visibly restart.
            if (frame.dataset.loaded && !frame.dataset.reloaded) setTimeout(function () {
                if (media !== playing) return;
                var answered = false;
                var onMsg = function (e) {
                    if (e.source !== frame.contentWindow) return;
                    try {
                        var d = JSON.parse(e.data);
                        if (d.method === 'getPaused') {
                            answered = true;
                            window.removeEventListener('message', onMsg);
                            if (d.value === true && media === playing) reload(frame);
                        }
                    } catch (err) {}
                };
                window.addEventListener('message', onMsg);
                post(frame, 'getPaused');
                setTimeout(function () {
                    window.removeEventListener('message', onMsg);
                    if (!answered && media === playing) reload(frame);
                }, 900);
            }, 600);
        }

        // Warm every tile, in order, one every 250ms. A paused background player
        // is light, and it means any tile the cursor lands on is already there.
        var warmAll = function () {
            document.querySelectorAll('.reel-media').forEach(warm);
        };
        warmAll();
        var target = document.getElementById('rosterContent');   // gated pages: tiles arrive after the unlock
        if (target) new MutationObserver(warmAll).observe(target, { childList: true });

        // Delegated, so it works on markup that only appears after the unlock.
        if (window.matchMedia && matchMedia('(hover: hover)').matches) {
            document.addEventListener('mouseover', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media) play(media);
            });
            document.addEventListener('mouseout', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media && media === playing && !media.contains(e.relatedTarget)) stop();
            });
        }

        // A click opens the tile in the full-screen viewer (custom player, sound on).
        document.addEventListener('click', function (e) {
            var media = e.target.closest && e.target.closest('.reel-media');
            if (!media) return;
            e.preventDefault();
            var idx = Array.prototype.indexOf.call(document.querySelectorAll('.reel-media'), media);
            stop();
            if (typeof openViewer === 'function' && idx !== -1) openViewer(idx);
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) stop();
        });

        // The tab title is generic until the page is unlocked.
        new MutationObserver(function (records, obs) {
            var name = document.querySelector('.director-name');
            if (!name) return;
            document.title = name.textContent;
            obs.disconnect();
        }).observe(document.getElementById('rosterContent'), { childList: true });
    })();
    </script>
</body>
</html>
