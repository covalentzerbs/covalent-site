    <style>

        /* CSS Variables */
        :root {
            /* One timing for every themed property, so nothing fades out of step. */
            --theme-transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease, -webkit-text-fill-color 300ms ease;
            --ice: #FAFBFC;
            --bond-blue: #5979e9;
            --black: #0A0A0A;
            --gray: #6B7280;
            /* Roster type: Bold Helvetica Neue, with a sane cross-platform fallback */
            --helv: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            --white: #FFFFFF;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        ::selection {
            background: var(--black);
            color: var(--white);
            -webkit-text-fill-color: var(--white);
        }

        html, body {
            height: 100%;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--white);
            pointer-events: none;
            z-index: 99999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
        }

        body {
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--black);
            overflow-x: hidden;
            letter-spacing: -0.04em;
        }

        /* Navigation - Plus Menu */
        .nav {
            position: fixed;
            top: 0;
            right: 0;
            /* right padding matches the content margin (24px), so the stack lines up with the grid edge */
            padding: 2rem 1.5rem 2rem 2rem;
            z-index: 10001;
        }

        /* Top-right nav: About and Contact stacked, small, in place of the old plus menu */
        .nav { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
        .nav-link {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--black);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .nav-link:hover, .nav-link.current { opacity: 1; }
        .nav-link:hover { color: #FF4500; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link { color: #FF4500 !important; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link:hover { color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF; }

        .menu-toggle {
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-toggle.active {
            transform: rotate(45deg);
        }

        .plus-icon {
            width: 18px;
            height: 18px;
            position: relative;
        }

        .plus-icon span {
            display: block;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--black);
            top: 50%;
            left: 0;
            transition: all 0.3s ease;
        }

        .plus-icon span:first-child {
            transform: translateY(-50%) rotate(90deg);
        }

        .plus-icon span:last-child {
            transform: translateY(-50%);
        }

        /* Expanded Menu */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 3rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .menu-overlay.active {
            pointer-events: auto;
            opacity: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.3);
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-link {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            color: var(--black);
            text-decoration: none;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.07em;
            line-height: 1.05;
        }

        .menu-overlay.active .menu-link {
            opacity: 0.6;
            transform: translateX(0);
        }

        .menu-overlay.active .menu-link:nth-child(1) { transition-delay: 0.05s; }
        .menu-overlay.active .menu-link:nth-child(2) { transition-delay: 0.1s; }
        .menu-overlay.active .menu-link:nth-child(3) { transition-delay: 0.15s; }
        .menu-overlay.active .menu-link:nth-child(4) { transition-delay: 0.25s; }
        .menu-overlay.active .menu-link:nth-child(5) { transition-delay: 0.3s; }

        

        .menu-socials {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-overlay.active .menu-socials {
            opacity: 0.5;
            transform: translateX(0);
            transition-delay: 0.3s;
        }

        .menu-link:hover {
            opacity: 1 !important;
        }

        .menu-link {
            position: relative;
            display: inline-block;
        }

        .menu-link-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #5979e9, #7B93FF, #5979e9, #3A5BD4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            opacity: 0;
            transition: opacity 0s;
        }

        .menu-link:hover .menu-link-gradient {
            opacity: 1;
        }

        .menu-link.current {
            opacity: 1 !important;
        }

        /* Logo Bottom Right */
        .logo-bottom {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .logo-bottom:hover { opacity: 1; }
        .logo-bottom:hover svg path { fill: #FF4500; }

        .logo-bottom svg {
            width: 40px;
            height: 40px;
        }

        .logo-bottom svg path {
            fill: var(--black); transition: fill 0.2s ease;
        }

        /* ==================== */
        /* CONTACT PAGE */
        /* ==================== */
        .contact-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .contact-email {
            font-size: clamp(2rem, 7vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.07em;
            line-height: 1.1;
            color: var(--bond-blue);
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .contact-email:hover {
            opacity: 0.7;
        }

        /* Copy toast */
        .copy-toast {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--black);
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20000;
            white-space: nowrap;
        }
        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ==================== */
        

        /* ==================== */
        /* CLOCK */
        /* ==================== */
        .clock-widget {
            position: fixed;
            bottom: 5rem;
            right: 3rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.15rem;
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            /* Hidden until JS fills the times, then fade in -
               avoids a flash of the "--:--" placeholder. */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .clock-widget.ready {
            opacity: 1;
        }

        .clock-row {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--black);
            letter-spacing: -0.07em;
        }

        .clock-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.07em;
            min-width: 2rem;
            text-align: right;
        }

        .clock-time {
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .clock-colon {
            opacity: 1;
            transition: opacity 0.15s ease;
        }

        .clock-colon.blink {
            opacity: 0;
        }

        /* ==================== */
        /* RESPONSIVE */
        /* ==================== */
        @media (max-width: 1024px) {
            .nav {
                padding: 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

            .menu-overlay {
                padding: 6rem 2.5rem 2.5rem;
            }

            .clock-widget {
                bottom: 4.5rem;
                right: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .nav {
                padding: 1.5rem 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

            .logo-bottom svg {
                width: 32px;
                height: 32px;
            }

            .menu-overlay {
                padding: 5rem 1.5rem 1.5rem;
            }

            .roster-page {
                padding: 7rem 1.5rem 3rem;
            }

        }

        /* Hide dot cursor on touch devices */
        @media (pointer: coarse) {
            .cursor { display: none !important; }
            * { cursor: auto !important; }
        }
        /* ==================== */
        /* DARK MODE OVERRIDES */
        /* ==================== */
        body.dark-mode {
            background-color: #0A0A0A !important;
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode ::selection {
            background: #FF4500 !important;
            color: #0A0A0A !important;
            -webkit-text-fill-color: #0A0A0A !important;
        }

        body.dark-mode .cursor {
            background: #FF4500 !important;
        }

        body.dark-mode .plus-icon span {
            background: #FF4500 !important;
        }

        body.dark-mode .menu-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .logo-bottom svg path {
            fill: #FF4500 !important;
        }
        body.dark-mode .logo-bottom:hover svg path { fill: #FFFFFF !important; }

        body.dark-mode .contact-email {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .clock-row {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .about-text {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-client {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-subtitle {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .scroll-progress-segment {
            background: #FF4500 !important;
        }

        body.dark-mode .director-name {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .director-credit {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link::after {
            background: #FF4500 !important;
        }

        body.dark-mode .hero-logo svg path {
            fill: #FF4500 !important;
        }

        /* ==================== */
        /* DARK MODE TOGGLE */
        /* ==================== */
        

        /* SOCIAL ICON BRAND HOVER */
        /* SOCIAL ICON BRAND HOVER - high-saturation feedback */
        

        /* Lift the muted .menu-socials row so the hovered icon shows full color */
        .menu-overlay.active .menu-socials:hover { opacity: 1 !important; }
        /* BRANDED SCROLLBAR - replaces the native macOS overlay scrollbar
           with a thin Bond-Blue line on the right edge of the page. */
        html {
            scrollbar-width: none;   /* no visible scrollbar; scrolling still works */
        }
        html::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        html::-webkit-scrollbar-track {
            background: transparent;
        }
        html::-webkit-scrollbar-thumb {
            background: rgba(89, 121, 233, 0.35);
            border-radius: 3px;
            border: 1px solid transparent;
            background-clip: padding-box;
            transition: background-color 0.2s ease;
        }
        html::-webkit-scrollbar-thumb:hover {
            background: var(--bond-blue, #5979e9);
        }

        /* Dark mode: paint the root element so the canvas stays dark while
           scrolling. body height:100% means its background does not reach the
           canvas once the page scrolls, leaving the root white. */
        html:has(body.dark-mode) {
            background-color: #0A0A0A;
        }

        /* ==================== */
        /* CREATIVE ROSTER      */
        /* ==================== */
        /* Page scrolls, so the footer flows after the content instead of
           being pinned like the single-screen pages. */
        html, body { height: auto; min-height: 100%; }

        .roster-page {
            width: 100%;
            /* full-bleed: every px of width buys a larger name before it wraps */
            padding: 9rem 2.5rem 4rem;
        }

        .roster-heading {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(2.5rem, 7vw, 5rem);
            letter-spacing: -0.035em;
            line-height: 0.95;
            text-transform: none;
            color: var(--black);
            margin-bottom: clamp(2.5rem, 6vw, 4.5rem);
        }

        /* ── 5 across x 3 down ── */
        .roster-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* rows sit tight: roughly a quarter of a line between names */
            gap: clamp(0.5rem, 0.9vw, 1.1rem) clamp(0.9rem, 1.6vw, 1.75rem);
            align-items: start;
        }

        .roster-item {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .roster-name {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(1.25rem, 3.45vw, 4.75rem);
            letter-spacing: -0.04em;
            line-height: 0.92;
            /* names are proper nouns — never fold to the site-wide lowercase */
            text-transform: none;
            color: var(--black);
            opacity: 0.55;
            display: block;
            /* one line per name, always */
            white-space: nowrap;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .roster-item:hover .roster-name {
            opacity: 1;
            transform: translateX(3px);
        }

        /* Respect users who prefer no motion — keep the opacity cue, drop the slide. */
        @media (prefers-reduced-motion: reduce) {
            .roster-name { transition: opacity 0.25s ease; }
            .roster-item:hover .roster-name { transform: none; }
        }

        /* Touch devices get no hover — show names at full strength instead. */
        @media (pointer: coarse) {
            .roster-name { opacity: 1; }
        }

        /* Column count steps down so names always stay on one line.
           These must come after the base .roster-list rule to win the cascade. */
        @media (max-width: 900px) {
            .roster-list { grid-template-columns: repeat(2, 1fr); row-gap: clamp(0.4rem, 1.2vw, 0.9rem); }
            .roster-name { font-size: clamp(1.1rem, 5.15vw, 3rem); }
        }
        /* Phones: one column, so every name stays on a single line at one
           consistent size. Spacing is pulled in tight so 16 names do not turn
           into an endless scroll. */
        @media (max-width: 600px) {
            .roster-page { padding: 5.5rem 1.25rem 2rem; }
            .roster-heading { margin-bottom: 1.5rem; }
            .roster-list {
                grid-template-columns: 1fr;
                gap: 0.35rem 0;
            }
            .roster-name { font-size: clamp(1.25rem, 7.6vw, 2.5rem); }
            .roster-disclaimer { margin-top: 2.25rem; }
        }

        /* ── Dark mode ── */
        /* ==================== */
        /* PASSWORD GATE        */
        /* ==================== */
        .gate {
            min-height: 55vh;
            display: flex;
            align-items: center;
        }

        .gate-form {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
            width: min(100%, 340px);
        }

        .gate-label {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(1.75rem, 4vw, 3rem);
            letter-spacing: -0.035em;
            line-height: 1;
            text-transform: none;
            color: var(--black);
        }

        .gate-field {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            border-bottom: 2px solid rgba(0, 0, 0, 0.25);
            transition: border-color 0.2s ease;
        }

        .gate-field:focus-within {
            border-bottom-color: var(--black);
        }

        .gate-input {
            font-family: var(--helv);
            font-weight: 400;
            font-size: 1rem;
            /* near-normal tracking — the page-wide -0.07em is unreadable at input size */
            letter-spacing: 0;
            flex: 1 1 auto;
            min-width: 0;
            padding: 0.65rem 0;
            color: var(--black);
            background: transparent;
            border: none;
            border-radius: 0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .gate-toggle {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem;
            background: transparent;
            border: none;
            color: var(--black);
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }

        .gate-toggle:hover,
        .gate-toggle:focus-visible { opacity: 0.85; }

        /* Icon swap is class-driven, not attribute-driven: `hidden` is an IDL
           property of HTMLElement, so `svg.hidden = true` sets a JS expando and
           never reaches the DOM, and the UA rule [hidden]{display:none} does not
           apply to the SVG namespace either. */
        .gate-toggle .gate-eye { display: block; }
        .gate-toggle .gate-eye-off { display: none; }
        .gate-toggle.is-masked .gate-eye { display: none; }
        .gate-toggle.is-masked .gate-eye-off { display: block; }

        .gate-btn {
            font-family: var(--helv);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: var(--white);
            background: var(--black);
            border: none;
            padding: 0.7rem 1.5rem;
            margin-top: 0.5rem;
            transition: opacity 0.2s ease;
        }

        .gate-btn:hover { opacity: 0.75; }
        .gate-btn:disabled { opacity: 0.4; }

        .gate-error {
            font-family: var(--helv);
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0;
            line-height: 1.5;
            color: var(--black);
            opacity: 0.55;
            min-height: 1.2em;
        }

        body.dark-mode .gate-label,
        body.dark-mode .gate-input,
        body.dark-mode .gate-error {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }
        body.dark-mode .gate-field { border-bottom-color: rgba(255, 69, 0, 0.4); }
        body.dark-mode .gate-field:focus-within { border-bottom-color: #FF4500; }
        body.dark-mode .gate-toggle { color: #FF4500 !important; }
        body.dark-mode .gate-btn {
            background: #FF4500 !important;
            color: #0A0A0A !important;
            -webkit-text-fill-color: #0A0A0A;
        }

        /* Mobile gate. Must come after the base .gate rules above to win the
           cascade — otherwise min-height/align-items fall back to desktop. */
        @media (max-width: 600px) {
            /* Footer is static on this page, so when the gate is short the page
               stops well before the fold and the footer floats mid-screen. Make
               the body fill the viewport and let main absorb the slack. */
            body {
                display: flex;
                flex-direction: column;
                min-height: 100svh;
            }
            .roster-page { flex: 1 0 auto; }
            .site-footer { margin-top: auto; }

            /* Locked only: centre the gate in the space main occupies. Scoped

        /* Fine print. Regular weight rather than the bold used for the names,

        body.dark-mode .roster-heading,

        /* ==================== */
        /* ROSTER HOVER PREVIEW */
        /* ==================== */
        /* Hovering a name that has a reel plays that reel's first clip full
           bleed behind the list; the name goes white and everything else
           steps out of the way. */
        .roster-page { position: relative; z-index: 1; }

        .roster-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #000;
            opacity: 0;

            position: absolute;
            top: 50%;
            left: 50%;
            width: max(100vw, 177.78vh);
            height: max(100vh, 56.25vw);
            transform: translate(-50%, -50%);
            border: 0;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .roster-bg iframe.is-ready { opacity: 1; }

        .roster-name { transition: opacity 0.18s ease, color 0.18s ease, transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body.roster-hover .roster-heading,
        body.roster-hover .roster-disclaimer { opacity: 0; }
        /* the rest of the list stays put, dimmed to 40% black over the footage */
        body.roster-hover .roster-name {
            opacity: 0.75;
            color: #000000 !important;
            -webkit-text-fill-color: #000000;
        }

        body.roster-hover .roster-item.is-hover .roster-name {
            opacity: 1;
            color: #FFFFFF !important;
            -webkit-text-fill-color: #FFFFFF;
        }

        /* chrome flips to white so it survives on top of the footage */
        body.roster-hover .logo-bottom svg path { fill: #FFFFFF !important; }
        body.roster-hover .plus-icon span { background: #FFFFFF !important; }
        body.roster-hover .nav-link { color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF; }
        body.roster-hover .site-footer-left,
        body.roster-hover .social-link { color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF; }

        
        /* Theme switch: a short cross-fade instead of a hard cut. The class is
           only on <body> for the duration of the fade, so it never fights the
           site's own transitions the rest of the time. */
        body.theme-fading,
        body.theme-fading *,
        body.theme-fading *::before,
        body.theme-fading *::after {
            transition: var(--theme-transition) !important;
        }

        /* ==================== */
        /* DIRECTOR REEL        */
        /* ==================== */
        /* Tight edges - the work should own as much of the page as possible. */
        .director-page { padding: 7rem 1.5rem 3rem; }

        .director-top {

            align-items: baseline;

        /* commercial / music videos switch: a small iOS-style toggle to the right of the name */
        .reel-switch { display: flex; align-items: center; gap: 0.6rem; margin-right: auto; }
        .reel-switch-label { background: none; border: 0; padding: 0; font-family: var(--helv); font-weight: 700; font-size: 0.7rem; letter-spacing: -0.02em; text-transform: uppercase; color: var(--black); opacity: 0.4; cursor: none; transition: opacity 0.2s ease; }
        .reel-switch-label.is-on, .reel-switch-label:hover { opacity: 1; }
        .reel-switch-track { position: relative; width: 36px; height: 21px; border-radius: 11px; border: 0; padding: 0; background: var(--black); cursor: none; transition: background-color 0.3s ease, transform 0.18s ease, box-shadow 0.2s ease; will-change: transform; }
        /* the knob stretches while pressed and springs across on release */
        .reel-switch-knob { position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 8px; background: var(--white); transform: translateX(var(--kx, 0px)) scale(var(--ks, 1)); transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.15s ease, background-color 0.3s ease; }
        .reel-switch-track:active .reel-switch-knob { width: 20px; }

        /* the cursor is in the toggle: the dot sits inside the knob as a pupil, the

        body.dark-mode .reel-switch-track { background: #FF4500; }
        body.dark-mode .reel-switch-knob { background: #0A0A0A; }
        .reel-grid[hidden] { display: none; }

        /* Three across, 5px apart. Every tile is the same 16:9 window so the
           grid reads as one block no matter what the source ratio is. */
        .reel-grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .reel-media {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            margin: 0;
            padding: 0;
            border: 0;
            background: #ECECEC;
            color: inherit;
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .reel-thumb {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Verticals are letterboxed rather than cropped to a sliver. Black,
           not grey, so the bars match the ones the Vimeo player draws on hover
           and the tile does not read as a hole in the mosaic. */
        .reel-media.is-portrait { background: #000; }
        .reel-media.is-portrait .reel-thumb { object-fit: cover; }   /* previews always fill the window */

        /* The player is sized to the clip's own aspect ratio (--va) and enlarged
           until it covers the 16:9 window, so 4:3 and square clips fill the tile
           instead of sitting in bars. The viewer shows them at their true shape. */
        .reel-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            /* a 1px bleed on every side hides the player's hairline edge; this used
               to be a 2% scale, which read as a small zoom when the player cut in */
            width: calc(max(100%, 100% * 0.5625 * var(--va, 1.778)) + 2px);
            height: calc(max(100%, 100% * 1.7778 / var(--va, 1.778)) + 2px);
            transform: translate(-50%, -50%);
            border: 0;
            opacity: 0;
            transition: none;   /* the player is already running: a hover is a cut */
            pointer-events: none;
        }

        /* The thumbnail stays put underneath the iframe - fading it out first
           would flash the empty tile while the player boots. */
        /* The player only shows once it reports real frames (is-live). Before its first
           play, Vimeo draws a blurry, scaled-up placeholder of the frame; cutting to that
           read as a small zoom hop on hover, so the sharp still stays up until then. */
        .reel-media.is-live .reel-frame { opacity: 1; }

        /* Title left, client right, on one line under the video. */
        .reel-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            margin-top: 5px;
        }

        .reel-title,
        .reel-client {
            font-family: var(--helv);
            font-weight: 700;
            font-size: clamp(0.7rem, 0.75vw, 0.85rem);
            letter-spacing: 0.01em;
            line-height: 1.25;
            text-transform: uppercase;
            color: var(--black);
        }

        /* client on the left, title on the right (the markup keeps title first; order swaps them) */
        .reel-client { order: 0; flex: 0 0 auto; text-align: left; }
        .reel-title { order: 1; flex: 1 1 auto; min-width: 0; text-align: right; }

        @media (max-width: 900px) {
            .reel-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .director-page { padding: 5.5rem 1rem 2rem; }
            .director-top { margin-bottom: 1rem; }
            .reel-grid { grid-template-columns: 1fr; gap: 5px; }
            .reel-title, .reel-client { font-size: 0.72rem; }
        }

        body.dark-mode .director-name,
        body.dark-mode .director-back,
        body.dark-mode .reel-title,
        body.dark-mode .reel-client {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .reel-media { background: #1A1A1A; }
        body.dark-mode .reel-media.is-portrait { background: #000; }
        /* ── Work Viewer ──────────────────────────────────── */

        .work-viewer { position:fixed; inset:0; z-index:1005; background:#000; display:block; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; opacity:0; pointer-events:none; transition:opacity 0.3s ease;
            --fh: min(calc(90vw / var(--va, 1.778)), calc(100svh - 170px)); --fw: calc(var(--fh) * var(--va, 1.778)); }

        .vd-handle { color:inherit; text-decoration:none; border-bottom:1px solid transparent; transition:border-color 0.2s ease; }
        .vd-handle:hover { border-bottom-color:currentColor; }

        .viewer-frame { position:relative; width:90vw; max-width:calc(90vh * 16 / 9); height:calc(90vw * 9 / 16); max-height:90vh; }

        .viewer-center-icon .cc-ic { display:none; }

        }
        .viewer-controls { position:absolute; left:0; right:0; bottom:0; padding:48px 134px 16px 20px; display:flex; align-items:center; gap:10px; background:linear-gradient(transparent,rgba(0,0,0,0.6)); z-index:3; transition:opacity .3s ease,transform .3s ease; }

        .viewer-progress .cs-progress-thumb { position:absolute; top:50%; left:0; width:11px; height:11px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); opacity:0; transition:opacity 0.15s ease; pointer-events:none; box-shadow:0 1px 5px rgba(0,0,0,0.5); }
        .viewer-progress:hover .cs-progress-thumb, .viewer-progress.dragging .cs-progress-thumb { opacity:1; }
        .viewer-progress:hover .cs-progress-track, .viewer-progress.dragging .cs-progress-track { height:4px; }
        /* scrubber frame preview (mini player seeked to the cursor time) */
        .scrub-preview { position:absolute; bottom:calc(100% + 6px); left:0; transform:translateX(-50%); width:168px; opacity:0; pointer-events:none; transition:opacity 0.12s ease; z-index:6; }
        .scrub-preview.show { opacity:1; }
        .scrub-preview-frame { width:168px; height:95px; border-radius:6px; overflow:hidden; background:#000; box-shadow:0 10px 34px rgba(0,0,0,0.55); position:relative; }
        .scrub-preview-frame iframe { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:100%; min-width:169px; min-height:95px; border:none; pointer-events:none; }
        .scrub-preview-time { display:block; text-align:center; margin-top:5px; font-size:11px; color:#fff; font-family:'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif; letter-spacing:-0.03em; text-shadow:0 1px 3px rgba(0,0,0,0.65); }
        .viewer-time { font-size:11px; color:rgba(255,255,255,0.7); white-space:nowrap; font-family:'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif; letter-spacing:-0.04em; }
        .viewer-close { position:absolute; top:1.5rem; right:1.5rem; z-index:10; background:none; border:none; cursor:none; padding:0.5rem; opacity:0.5; transition:opacity 0.2s; line-height:0; }

        .viewer-meta { position:absolute; bottom:2rem; left:3rem; display:none; flex-direction:column; gap:0.2rem; pointer-events:none; }
        .viewer-client-label { font-size:0.6rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.4); }
        .viewer-title-label { font-size:0.95rem; font-weight:400; color:rgba(255,255,255,0.85); text-transform:lowercase; }
        .viewer-nav { display:none; position:absolute; top:50%; transform:translateY(-50%); background:none; border:none; cursor:none; padding:1.2rem; opacity:0.4; transition:opacity 0.2s; line-height:0; }
        .viewer-nav:hover { opacity:1; }
        .viewer-prev { left:0.5rem; }
        .viewer-next { right:0.5rem; }
        /* viewer open: hide page chrome (menu +) and the corner close; clicking the margin closes */
        body.viewer-open .nav { opacity:0 !important; pointer-events:none !important; }
        body.viewer-open .logo-bottom, body.viewer-open .site-footer { opacity:0 !important; pointer-events:none !important; }
        /* fullscreen: let the native cursor show (the custom cursor can't render outside the fullscreen element) */
        :fullscreen, :fullscreen * { cursor:auto !important; }
        :-webkit-full-screen, :-webkit-full-screen * { cursor:auto !important; }
        /* fullscreen idle: hide cursor + controls + expand button after 1s of no movement */
        #viewerFrame.fs-idle, #viewerFrame.fs-idle * { cursor:none !important; }
        #viewerFrame.fs-idle .viewer-controls, #viewerFrame.fs-idle .viewer-fs-corner, #viewerFrame.fs-idle .viewer-vol, #viewerFrame.fs-idle .viewer-air { opacity:0 !important; pointer-events:none !important; }
        .viewer-close { display:none; }
        /* exit cursor: an X that follows the pointer over the margin around the video */
        #viewerExitCursor { position:fixed; left:-200px; top:-200px; line-height:0;
            transform:translate(-50%,-50%) scale(.85); opacity:0; pointer-events:none; z-index:10080;
            mix-blend-mode:difference; transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1);
            will-change:transform,left,top,opacity; }
        #viewerExitCursor.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
        body.viewer-exit-active .cursor { opacity:0 !important; }
        /* in the reel switch the dot goes away; the halo on the track is the cue */

        /* scrolling the grid tucks the logo and the About / Contact links away */

        body.is-scrolled .nav, body.is-scrolled .logo-bottom { opacity:0; pointer-events:none; }
        /* bigger hit zones, so wherever the magnetic cursor lands is clickable;

    <script>
        // ==================== //
        // CUSTOM CURSOR
        // ==================== //
        const cursor = document.getElementById('cursor');
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            cursor.style.display = 'none';
        }

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // a page may set window.__cursorMagnet = { x, y, scale } to pull the dot
        // onto a target (the work viewer's timeline and buttons do this)
        let magnetScale = 1;
        function animateCursor() {
            const mag = window.__cursorMagnet;
            // pull: how far toward the target the dot settles (1 = dead on it)
            const pull = mag ? (mag.pull == null ? 1 : mag.pull) : 0;
            const k = mag ? 0.4 : 0.35;
            cursorX += ((mag ? mouseX + (mag.x - mouseX) * pull : mouseX) - cursorX) * k;
            cursorY += ((mag ? mouseY + (mag.y - mouseY) * pull : mouseY) - cursorY) * k;
            const ms = mag ? (mag.scale || 1) : 1;
            if (ms !== magnetScale) {
                magnetScale = ms;
                cursor.style.transition = 'transform 0.2s ease, left 0s, top 0s';
                cursor.style.transform = 'translate(-50%, -50%) scale(' + ms + ')';
            }
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // ==================== //
        // MENU TOGGLE
        // ==================== //
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        menuToggle && menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        menuOverlay && menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (menuOverlay && menuOverlay.classList.contains('active'))) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // ==================== //
        // MENU LINK GRADIENT SPREAD EFFECT
        // ==================== //
        // (menu hover handled by CSS only)

        // ==================== //
        // VIRUS SPREADING TEXT EFFECT (footer)
        // ==================== //
        const virusLinks = document.querySelectorAll('.footer-link');

        virusLinks.forEach(link => {
            const text = link.textContent;
            link.textContent = '';

            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const char = document.createElement('span');
                char.className = 'char';
                char.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                link.appendChild(char);
                chars.push(char);
            }

            let isInfected = false;

            link.addEventListener('mouseenter', (e) => {
                if (isInfected) return;
                isInfected = true;

                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => a.distance - b.distance);

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.add('infected');
                        if (i === charDistances.length - 1) {
                            link.classList.add('fully-infected');
                        }
                    }, i * 30);
                });
            });

            link.addEventListener('mouseleave', (e) => {
                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => b.distance - a.distance);
                link.classList.remove('fully-infected');

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.remove('infected');
                        if (i === charDistances.length - 1) {
                            isInfected = false;
                        }
                    }, i * 25);
                });
            });
        });
    </script>

        (function() {

            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {

    <script>
    // Re-enforce cursor:none via injected stylesheet (bfcache-safe). Coming back
    // to a page through history, Chrome can keep drawing the arrow until the
    // cursor property on the hovered element actually changes, so on every
    // pageshow (and the first movement after it) the rule flips default -> none.
    (function() {
        var style = null;
        function setRule(value) {
            if (!style || !style.parentNode) {
                var existing = document.getElementById('no-native-cursor');
                if (existing) existing.remove();
                style = document.createElement('style');
                style.id = 'no-native-cursor';
                document.head.appendChild(style);
            }
            style.textContent = 'html, html *, body, body * { cursor: ' + value + ' !important; }';
        }
        function enforceNoCursor() {
            setRule('default');
            void document.documentElement.offsetWidth;
            setRule('none');
        }
        enforceNoCursor();
        window.addEventListener('pageshow', function(e) {
            enforceNoCursor();
            setTimeout(enforceNoCursor, 50);
            var cursor = document.getElementById('cursor');
            if (cursor && !('ontouchstart' in window)) {
                cursor.style.display = 'block';
            }
            document.addEventListener('mousemove', enforceNoCursor, { once: true });
        });
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) enforceNoCursor();
        });

        var form    = document.getElementById('gateForm');
        var input   = document.getElementById('gatePassword');
        var btn     = document.getElementById('gateBtn');
        var errorEl = document.getElementById('gateError');
        var gate    = document.getElementById('gate');
        var target  = document.getElementById('rosterContent');
        var payload = JSON.parse(document.getElementById('rosterPayload').textContent);
        var KEY     = 'covalent.roster.pw';

        function b64(s) {
            var bin = atob(s), out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        async function decrypt(password) {
            var base = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            var key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64(payload.s), iterations: payload.n, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            var plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: b64(payload.i) }, key, b64(payload.c));
            return new TextDecoder().decode(plain);
        }

        function reveal(html) {
            target.innerHTML = html;
            target.hidden = false;
            gate.remove();
            document.body.classList.add('roster-unlocked');
        }

        async function attempt(password, fromStore) {
            try {
                reveal(await decrypt(password));
                try { sessionStorage.setItem(KEY, password); } catch (e) {}
                return true;
            } catch (e) {
                // a bad password fails the GCM auth tag and lands here
                if (!fromStore) {
                    errorEl.textContent = 'Incorrect password.';
                    input.value = '';
                    input.focus();
                }
                try { if (fromStore) sessionStorage.removeItem(KEY); } catch (e2) {}
                return false;
            }
        }

        // Web Crypto needs a secure context (https or localhost).
        if (!window.crypto || !crypto.subtle) {
            errorEl.textContent = 'This page needs a secure (https) connection.';
            if (btn) btn.disabled = true;
            return;
        }

        // stay unlocked while the tab is open
        var saved = null;
        try { saved = sessionStorage.getItem(KEY); } catch (e) {}
        if (saved) attempt(saved, true);

        // Password starts visible; this masks it. Caret position is preserved so
        // toggling mid-typing does not jump the cursor to the end.
        var toggle = document.getElementById('gateToggle');
        toggle.addEventListener('click', function () {
            var wasMasked = input.type === 'password';
            var start = input.selectionStart, end = input.selectionEnd;
            var nowMasked = !wasMasked;
            input.type = nowMasked ? 'password' : 'text';
            toggle.classList.toggle('is-masked', nowMasked);
            toggle.setAttribute('aria-pressed', nowMasked ? 'true' : 'false');
            var lbl = nowMasked ? 'Show password' : 'Hide password';
            toggle.setAttribute('aria-label', lbl);
            toggle.setAttribute('title', lbl);
            input.focus();
            try { input.setSelectionRange(start, end); } catch (err) {}
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var pw = input.value;
            if (!pw) return;
            errorEl.textContent = '';
            btn.disabled = true;
            await attempt(pw, false);
            btn.disabled = false;
        });
    })();
    </script>

    <script>
    // Hover preview. Names carry data-reel (their reel's first Vimeo id) inside
    // the encrypted markup, so this is delegated and only wires up post-unlock.
    // Every reel's player is created once, warmed up paused in the background,
    // and just toggled on hover - so the clip is already buffered when the
    // cursor lands on a name.
    (function () {
        if (!(window.matchMedia && matchMedia('(hover: hover)').matches)) return;
        var bg = document.getElementById('rosterBg');
        var frames = {};        // vimeo id -> iframe
        var current = null, active = null;

        function post(frame, method, value) {
            try {
                frame.contentWindow.postMessage(JSON.stringify(
                    value === undefined ? { method: method } : { method: method, value: value }), '*');
            } catch (e) {}
        }

        function frameFor(item) {
            var id = item.getAttribute('data-reel');
            if (!id) return null;
            if (frames[id]) return frames[id];
            var hash = item.getAttribute('data-reel-hash');
            var f = document.createElement('iframe');
            f.src = 'https://player.vimeo.com/video/' + id +
                    '?background=1&autoplay=0&loop=1&muted=1&dnt=1&quality=720p' +
                    (hash ? '&h=' + hash : '');
            f.setAttribute('allow', 'autoplay');
            f.setAttribute('tabindex', '-1');
            f.title = '';
            f.addEventListener('load', function () {
                f.dataset.loaded = '1';
                post(f, 'addEventListener', 'play');
                // background=1 wants to autoplay; hold it until it is hovered
                if (active !== f) post(f, 'pause');
                else post(f, 'play');
            });
            bg.appendChild(f);
            frames[id] = f;
            return f;
        }

        // Player events arrive as postMessages; route the "play" event back to
        // the frame that sent it so a switch can wait for real playback.
        window.addEventListener('message', function (e) {
            if (e.origin !== 'https://player.vimeo.com') return;
            var d; try { d = JSON.parse(e.data); } catch (err) { return; }
            if (d.event !== 'play') return;
            for (var id in frames) {
                if (frames[id].contentWindow === e.source && frames[id]._onPlay) {
                    frames[id]._onPlay();
                    return;
                }
            }
        });

        // The player answers getPaused; if it will not start from the warm
        // state within a beat, reload it with autoplay on. Slower, but never
        // a frozen frame.
        var playCheck = null;
        function ensurePlaying(f) {
            clearTimeout(playCheck);
            var answered = false;
            function onMsg(e) {
                if (e.source !== f.contentWindow) return;
                try {
                    var d = JSON.parse(e.data);
                    if (d.method === 'getPaused') {
                        answered = true;
                        window.removeEventListener('message', onMsg);
                        if (d.value === true && active === f) reload(f);
                    }
                } catch (err) {}
            }
            window.addEventListener('message', onMsg);
            post(f, 'getPaused');
            playCheck = setTimeout(function () {
                window.removeEventListener('message', onMsg);
                if (!answered && active === f) reload(f);
            }, 900);
        }
        function reload(f) {
            if (f.dataset.reloaded) return;
            f.dataset.reloaded = '1';
            f.src = f.src.replace('autoplay=0', 'autoplay=1');
        }

        var leaveTimer = null;

        // Fully off the list: fade everything back. Debounced, because the
        // cursor crosses the gap between two names on the way to the next one
        // and that must not read as a leave.
        function leave() {
            clearTimeout(leaveTimer);
            leaveTimer = setTimeout(function () {
                if (!current) return;
                clearTimeout(playCheck);
                current.classList.remove('is-hover');
                current = null;
                document.body.classList.remove('roster-hover');
                bg.classList.remove('is-on');
                if (active) {
                    var f = active;
                    active = null;
                    f._onPlay = null;
                    f.classList.remove('is-ready');
                    post(f, 'pause');
                }
            }, 140);
        }

        // Name to name: the previous clip stays on screen until the next one
        // reports it is actually playing, then they cross-fade. No black gap.
        function enter(item) {
            clearTimeout(leaveTimer);
            if (item === current) return;
            var f = frameFor(item);
            if (!f) return;
            if (current) current.classList.remove('is-hover');
            current = item;
            item.classList.add('is-hover');
            document.body.classList.add('roster-hover');
            bg.classList.add('is-on');

            var prev = active;
            active = f;
            clearTimeout(playCheck);
            if (prev && prev !== f) prev._onPlay = null;

            var swapped = false, swapTimer = null;
            function swap() {
                if (swapped || active !== f) return;
                swapped = true;
                clearTimeout(swapTimer);
                f._onPlay = null;
                f.classList.add('is-ready');
                if (prev && prev !== f) { prev.classList.remove('is-ready'); post(prev, 'pause'); }
                setTimeout(function () { if (active === f) ensurePlaying(f); }, 250);
            }
            f._onPlay = swap;
            if (f.dataset.loaded) {
                post(f, 'play');
                // if the play event never comes, swap anyway
                swapTimer = setTimeout(swap, 700);
            } else {
                // still loading: the load handler plays it and the play event lands here
                swapTimer = setTimeout(swap, 2500);
            }
        }

        // Warm every reel once the list is on the page, one at a time so they
        // do not all fight for the same connections.
        function warm() {
            var items = [].slice.call(document.querySelectorAll('.roster-item[data-reel]'));
            var i = 0;
            (function next() {
                if (i >= items.length) return;
                frameFor(items[i++]);
                setTimeout(next, 350);
            })();
        }
        var idle = window.requestIdleCallback || function (cb) { setTimeout(cb, 200); };
        new MutationObserver(function (records, obs) {
            if (!document.querySelector('.roster-item[data-reel]')) return;
            obs.disconnect();
            idle(warm);
        }).observe(document.getElementById('rosterContent'), { childList: true });

        document.addEventListener('mouseover', function (e) {
            var item = e.target.closest && e.target.closest('.roster-item[data-reel]');
            if (item) enter(item);
        });
        document.addEventListener('mouseout', function (e) {
            var item = e.target.closest && e.target.closest('.roster-item[data-reel]');
            if (item && item === current && !item.contains(e.relatedTarget)) leave();
        });
        document.addEventListener('visibilitychange', function () { if (document.hidden) leave(); });
        window.addEventListener('pagehide', leave);
    })();
    </script>

    <script>
    // Commercial / music videos switch. Both grids are in the page; the switch
    // shows one of them, and #music in the URL opens on the music side.
    (function () {
        function setSide(side, push) {
            var sw = document.querySelector('.reel-switch'); if (!sw) return;
            document.querySelectorAll('.reel-grid[data-set]').forEach(function (g) { g.hidden = g.getAttribute('data-set') !== side; });
            sw.querySelectorAll('.reel-switch-label').forEach(function (l) { l.classList.toggle('is-on', l.getAttribute('data-set') === side); });
            sw.querySelector('.reel-switch-track').setAttribute('aria-checked', side === 'music' ? 'true' : 'false');
            if (push) { try { history.replaceState(null, '', side === 'music' ? '#music' : location.pathname + location.search); } catch (e) {} }
            window.dispatchEvent(new Event('reelsetchange'));
        }
        document.addEventListener('click', function (e) {
            var t = e.target.closest && e.target.closest('.reel-switch-label, .reel-switch-track'); if (!t) return;
            e.preventDefault();
            var side = t.classList.contains('reel-switch-track')
                ? (t.getAttribute('aria-checked') === 'true' ? 'commercial' : 'music')
                : t.getAttribute('data-set');
            setSide(side, true);
            followKnob();
        });
        // near the switch the cursor dot snaps to the knob and disappears; the halo
        // on the track (is-hot) says the pointer is in, and the dot pops back out on leaving
        // (shared magnet: a script only clears a target it set itself)
        function setMagnet(owner, m) { var cur = window.__cursorMagnet; if (m) { m.owner = owner; window.__cursorMagnet = m; } else if (cur && cur.owner === owner) { window.__cursorMagnet = null; } }
        var leaned = [];
        function clearLean(except) { leaned.forEach(function (b) { if (b !== except) { b.style.transform = ''; b.classList.remove('is-hot'); } }); leaned = except ? [except] : []; }
        var lastX = null, lastY = null;
        function track(x, y) {
            var sw = document.querySelector('.reel-switch');
            if (!sw || document.body.classList.contains('viewer-open')) { clearLean(); setMagnet('switch', null); document.body.classList.remove('switch-hot'); return; }
            var parts = sw.querySelectorAll('.reel-switch-track'), pad = 14;
            for (var i = 0; i < parts.length; i++) {
                var b = parts[i], r = b.getBoundingClientRect();
                if (x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) continue;
                var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                var k = b.querySelector('.reel-switch-knob').getBoundingClientRect(), tx = k.left + k.width / 2, ty = k.top + k.height / 2;
                b.style.transform = 'translate(' + ((x - cx) * 0.08).toFixed(1) + 'px,' + ((y - cy) * 0.08).toFixed(1) + 'px)';
                b.classList.add('is-hot'); document.body.classList.add('switch-hot');
                clearLean(b);
                setMagnet('switch', { x: tx, y: ty, scale: 1.2, pull: 1 });
                return;
            }
            clearLean(); setMagnet('switch', null); document.body.classList.remove('switch-hot');
        }
        document.addEventListener('mousemove', function (e) { lastX = e.clientX; lastY = e.clientY; track(lastX, lastY); }, { passive: true });
        // after a click the knob slides for a third of a second while the pointer
        // sits still: keep re-reading the knob so the dot rides across with it
        function followKnob() {
            var until = performance.now() + 500;
            (function step() { if (lastX !== null) track(lastX, lastY); if (performance.now() < until) requestAnimationFrame(step); })();
        }
        window.__setReelSide = setSide;
        function initial() { if (document.querySelector('.reel-switch')) setSide(location.hash === '#music' ? 'music' : 'commercial', false); }
        initial();
        var target = document.getElementById('rosterContent');   // gated pages: the markup arrives after the unlock
        if (target) new MutationObserver(initial).observe(target, { childList: true });
    })();
    </script>

        function hideGaugeSoon(){ clearTimeout(volHideT); volHideT=setTimeout(function(){ if(!volDragging) volWrap.classList.remove('show-gauge'); },500); }
        function volFromY(e){ var r=volTrack.getBoundingClientRect(); return Math.max(0,Math.min(1, 1-(e.clientY-r.top)/r.height)); }
        volBtn.addEventListener('click', function(e){ e.stopPropagation(); vMuted=!vMuted; if(!vMuted&&vVolume===0) vVolume=1; applyVol(); showGauge(); });
        volWrap.addEventListener('mouseenter', showGauge);
        volWrap.addEventListener('mouseleave', hideGaugeSoon);
        // the whole gauge takes the press (its ::before adds a margin); the level
        // is still read off the line's own height
        var volGauge=document.getElementById('viewerVolGauge');
        volGauge.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); volDragging=true; var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); });
        volGauge.addEventListener('click', function(e){ e.stopPropagation(); });
        document.addEventListener('mousemove', function(e){ if(volDragging){ var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); } }, {passive:true});
        document.addEventListener('mouseup', function(){ volDragging=false; });
        renderVol();
        // Keep the controls + corner buttons alive while the cursor is anywhere in the
        // frame (incl. the volume/expand buttons, which are siblings of the video-hero).
        // Don't auto-hide while the volume gauge is open or being dragged.
        function csIdleHide(){ if(!volWrap.classList.contains('show-gauge') && !volDragging) vHero.classList.remove('cs-hover'); }
        function csPoke(){ vHero.classList.add('cs-hover'); clearTimeout(idleTimer); if(vPlaying) idleTimer=setTimeout(csIdleHide,2000); }
        frame.addEventListener('mouseenter', csPoke);
        frame.addEventListener('mousemove',  csPoke);
        frame.addEventListener('mouseleave', function(){ vHero.classList.remove('cs-hover'); clearTimeout(idleTimer); });
        if(closeBtn) closeBtn.addEventListener('click',closeViewer);
        // a click on the black around the content closes (the X cursor signals this)
        viewer.addEventListener('click',function(e){
            if(!viewer.classList.contains('active'))return;
            if(onBackdrop(e)) closeViewer();
        });
        prevBtn.addEventListener('click',function(e){e.stopPropagation();if(current>0)openViewer(current-1);});
        nextBtn.addEventListener('click',function(e){e.stopPropagation();if(current<viewerItems.length-1)openViewer(current+1);});
        document.addEventListener('keydown',function(e){
            if(!viewer.classList.contains('active'))return;
            if(e.key==='Escape')closeViewer();
            if(e.key==='ArrowLeft'&&current>0)openViewer(current-1);
            if(e.key==='ArrowRight'&&current<viewerItems.length-1)openViewer(current+1);
            if(e.key===' '){e.preventDefault();togglePlay(true);}
            if(e.key==='m'||e.key==='M'){vMuted=!vMuted;if(!vMuted&&vVolume===0)vVolume=1;applyVol();showGauge();}
            if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFs();}
        });
    })();
    </script>

    <script>
    // Reel playback. Every tile's player is created paused as the tile scrolls
    // into view (a few at a time), so hovering a tile plays a player that is
    // already loaded: no wait. One clip plays at a time.
    (function () {
        var playing = null, warmQueue = [], warming = false;
        // Hover previews start this many seconds in: a few spots open on black or a
        // slow fade, which reads as a broken site when it is the first thing seen.
        var START = 5;

        function post(frame, method, value) {
            try { frame.contentWindow.postMessage(JSON.stringify(value === undefined ? { method: method } : { method: method, value: value }), '*'); } catch (e) {}
        }
        // Player events: the hovered tile's player is revealed on its first real frame
        // ('playing' / 'timeupdate'), and a looping preview that wraps back to 0 is
        // pushed to START again.
        window.addEventListener('message', function (e) {
            if (e.origin !== 'https://player.vimeo.com') return;
            var d; try { d = JSON.parse(e.data); } catch (err) { return; }
            if (d.event !== 'timeupdate' && d.event !== 'playing') return;
            var frames = document.querySelectorAll('.reel-frame'), frame = null;
            for (var i = 0; i < frames.length; i++) if (frames[i].contentWindow === e.source) { frame = frames[i]; break; }
            if (!frame) return;
            var media = frame.parentNode;
            if (media === playing) media.classList.add('is-live');
            if (d.event !== 'timeupdate' || !d.data) return;
            if (d.data.seconds >= START - 0.5 || (d.data.duration && d.data.duration < START + 2)) return;
            post(frame, 'setCurrentTime', START);
        });

        function frameOf(media) { return media.querySelector('.reel-frame'); }

        function build(media, autoplay) {
            var id = media.getAttribute('data-vimeo');
            if (!id) return null;
            var hash = media.getAttribute('data-hash');   // unlisted videos carry one
            var frame = document.createElement('iframe');
            frame.className = 'reel-frame';
            frame.src = 'https://player.vimeo.com/video/' + id +
                        '?background=1&autoplay=' + (autoplay ? 1 : 0) + '&loop=1&muted=1&dnt=1&quality=540p' +
                        (hash ? '&h=' + hash : '') + '#t=' + START + 's';
            frame.setAttribute('frameborder', '0');
            frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
            frame.setAttribute('tabindex', '-1');
            frame.setAttribute('aria-hidden', 'true');
            frame.title = '';
            frame.style.setProperty('--va', media.getAttribute('data-va') || '1.778');
            frame.addEventListener('load', function () {
                frame.dataset.loaded = '1';
                // background=1 starts on its own; hold it until it is hovered
                post(frame, media === playing ? 'play' : 'pause');
                post(frame, 'addEventListener', 'timeupdate');
                post(frame, 'addEventListener', 'playing');
            });
            media.appendChild(frame);
            return frame;
        }

        // warm one tile at a time so they do not all fight for the same connections
        function warm(media) {
            if (frameOf(media) || warmQueue.indexOf(media) !== -1) return;
            warmQueue.push(media);
            if (!warming) drain();
        }
        function drain() {
            var media = warmQueue.shift();
            if (!media) { warming = false; return; }
            warming = true;
            if (!frameOf(media)) build(media, false);
            setTimeout(drain, 250);
        }

        function reload(frame) {
            frame.dataset.reloaded = '1';
            frame.src = frame.src.replace('autoplay=0', 'autoplay=1');
        }

        function stop() {
            if (!playing) return;
            var frame = frameOf(playing);
            if (frame) post(frame, 'pause');
            playing.classList.remove('is-playing', 'is-live');
            playing = null;
        }

        function play(media) {
            if (media === playing) return;
            stop();
            var frame = frameOf(media);
            if (!frame) frame = build(media, true);      // not warmed yet: load it already playing
            else if (frame.dataset.loaded) post(frame, 'play');
            if (!frame) return;
            media.classList.add('is-playing');
            playing = media;
            // A warm player that will not start from a pause gets reloaded playing.
            // Asked after a beat: asking the instant after "play" reports paused
            // (play is async) and the reload made the clip visibly restart.
            if (frame.dataset.loaded && !frame.dataset.reloaded) setTimeout(function () {
                if (media !== playing) return;
                var answered = false;
                var onMsg = function (e) {
                    if (e.source !== frame.contentWindow) return;
                    try {
                        var d = JSON.parse(e.data);
                        if (d.method === 'getPaused') {
                            answered = true;
                            window.removeEventListener('message', onMsg);
                            if (d.value === true && media === playing) reload(frame);
                        }
                    } catch (err) {}
                };
                window.addEventListener('message', onMsg);
                post(frame, 'getPaused');
                setTimeout(function () {
                    window.removeEventListener('message', onMsg);
                    if (!answered && media === playing) reload(frame);
                }, 900);
            }, 600);
        }

        // Warm the first screenful of tiles on load and the rest as they come
        // near the viewport, one every 250ms. Touch devices skip warming
        // entirely: there is no hover, a tap opens the viewer, and fewer player
        // loads keep Vimeo's rate limiter from serving its bot-check page.
        var canHover = !(window.matchMedia && matchMedia('(hover: none)').matches);
        function near(el) { var r = el.getBoundingClientRect(); return r.bottom > -400 && r.top < window.innerHeight + 400; }
        var warmNear = function () {
            if (!canHover) return;
            document.querySelectorAll('.reel-grid:not([hidden]) .reel-media').forEach(function (m, i) {
                if (frameOf(m)) return;
                if (i < 9 || near(m)) warm(m);
            });
        };
        warmNear();
        window.addEventListener('scroll', warmNear, { passive: true });
        window.addEventListener('resize', warmNear);
        window.addEventListener('reelsetchange', function () { stop(); warmNear(); });
        var target = document.getElementById('rosterContent');   // gated pages: tiles arrive after the unlock
        if (target) new MutationObserver(warmNear).observe(target, { childList: true });

        // Delegated, so it works on markup that only appears after the unlock.
        if (window.matchMedia && matchMedia('(hover: hover)').matches) {
            document.addEventListener('mouseover', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media) play(media);
            });
            document.addEventListener('mouseout', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media && media === playing && !media.contains(e.relatedTarget)) stop();
            });
        }

        // A click opens the tile in the full-screen viewer (custom player, sound on).
        document.addEventListener('click', function (e) {
            var media = e.target.closest && e.target.closest('.reel-media');
            if (!media) return;
            e.preventDefault();
            var idx = Array.prototype.indexOf.call(document.querySelectorAll('.reel-grid:not([hidden]) .reel-media'), media);
            stop();
            if (typeof openViewer === 'function' && idx !== -1) openViewer(idx);
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) stop();
        });

        // The tab title is generic until the page is unlocked.
        new MutationObserver(function (records, obs) {
            var name = document.querySelector('.director-name');
            if (!name) return;
            document.title = name.textContent.toLowerCase() + '.';
            obs.disconnect();
        }).observe(document.getElementById('rosterContent'), { childList: true });
    })();
    </script>
