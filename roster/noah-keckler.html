            else { var req=target.requestFullscreen||target.webkitRequestFullscreen; if(req){ var p=req.call(target); if(p&&p.catch) p.catch(function(){}); } }
        }
        fsBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleFs(); });
        // fullscreen: hide cursor + controls + expand button after 1s of no movement
        var fsIdleTimer=null;
        function inFs(){ return document.fullscreenElement||document.webkitFullscreenElement; }
        function fsIdleHide(){ if(inFs()) frame.classList.add('fs-idle'); }
        function fsPoke(){ if(fsIdleTimer)clearTimeout(fsIdleTimer); frame.classList.remove('fs-idle'); if(inFs()) fsIdleTimer=setTimeout(fsIdleHide,1000); }
        function fsLeave(){ frame.classList.remove('fs-idle'); if(fsIdleTimer){clearTimeout(fsIdleTimer);fsIdleTimer=null;} }
        document.addEventListener('mousemove', function(){ if(inFs()) fsPoke(); }, {passive:true});
        document.addEventListener('fullscreenchange', function(){ inFs()?fsPoke():fsLeave(); });
        document.addEventListener('webkitfullscreenchange', function(){ inFs()?fsPoke():fsLeave(); });
        // volume: mute toggle + draggable gauge (videos autoplay muted, so this is how sound comes on)
        var volWrap=document.getElementById('viewerVol'), volBtn=document.getElementById('viewerVolBtn'),
            volTrack=document.getElementById('viewerVolTrack'), volFill=document.getElementById('viewerVolFill'), volHideT=null;
        function renderVol(){ var off=(vMuted||vVolume===0); volWrap.classList.toggle('muted',off); volFill.style.height=((off?0:vVolume)*100)+'%'; volBtn.setAttribute('data-cursor',off?'unmute':'mute'); }
        function applyVol(){ if(!vPlayer)return; var off=(vMuted||vVolume===0); try{ if(vPlayer.setMuted) vPlayer.setMuted(off); }catch(e){} try{ vPlayer.setVolume(off?0:vVolume).catch(function(){}); }catch(e){} renderVol(); }
        function showGauge(){ clearTimeout(volHideT); volWrap.classList.add('show-gauge'); }
        function hideGaugeSoon(){ clearTimeout(volHideT); volHideT=setTimeout(function(){ if(!volDragging) volWrap.classList.remove('show-gauge'); },500); }
        function volFromY(e){ var r=volTrack.getBoundingClientRect(); return Math.max(0,Math.min(1, 1-(e.clientY-r.top)/r.height)); }
        volBtn.addEventListener('click', function(e){ e.stopPropagation(); vMuted=!vMuted; if(!vMuted&&vVolume===0) vVolume=1; applyVol(); showGauge(); });
        volWrap.addEventListener('mouseenter', showGauge);
        volWrap.addEventListener('mouseleave', hideGaugeSoon);
        volTrack.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); volDragging=true; var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); });
        document.addEventListener('mousemove', function(e){ if(volDragging){ var v=volFromY(e); vVolume=v; vMuted=(v===0); applyVol(); } }, {passive:true});
        document.addEventListener('mouseup', function(){ volDragging=false; });
        renderVol();
        // Keep the controls + corner buttons alive while the cursor is anywhere in the
        // frame (incl. the volume/expand buttons, which are siblings of the video-hero).
        // Don't auto-hide while the volume gauge is open or being dragged.
        function csIdleHide(){ if(!volWrap.classList.contains('show-gauge') && !volDragging) vHero.classList.remove('cs-hover'); }
        function csPoke(){ vHero.classList.add('cs-hover'); clearTimeout(idleTimer); if(vPlaying) idleTimer=setTimeout(csIdleHide,2000); }
        frame.addEventListener('mouseenter', csPoke);
        frame.addEventListener('mousemove',  csPoke);
        frame.addEventListener('mouseleave', function(){ vHero.classList.remove('cs-hover'); clearTimeout(idleTimer); });
        if(closeBtn) closeBtn.addEventListener('click',closeViewer);
        // click anywhere outside the video bounds closes (the EXIT cursor signals this)
        viewer.addEventListener('click',function(e){
            if(!viewer.classList.contains('active'))return;
            if(e.target && e.target.closest && e.target.closest('.viewer-nav')) return;
            if(!ptrInsideFrame(e)) closeViewer();
        });
        prevBtn.addEventListener('click',function(e){e.stopPropagation();if(current>0)openViewer(current-1);});
        nextBtn.addEventListener('click',function(e){e.stopPropagation();if(current<viewerItems.length-1)openViewer(current+1);});
        document.addEventListener('keydown',function(e){
            if(!viewer.classList.contains('active'))return;
            if(e.key==='Escape')closeViewer();
            if(e.key==='ArrowLeft'&&current>0)openViewer(current-1);
            if(e.key==='ArrowRight'&&current<viewerItems.length-1)openViewer(current+1);
            if(e.key===' '){e.preventDefault();togglePlay(true);}
            if(e.key==='m'||e.key==='M'){vMuted=!vMuted;if(!vMuted&&vVolume===0)vVolume=1;applyVol();showGauge();}
            if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFs();}
        });
    })();
    </script>

    <script>
    // Reel playback. Every tile's player is created paused as the tile scrolls
    // into view (a few at a time), so hovering a tile plays a player that is
    // already loaded: no wait. One clip plays at a time.
    (function () {
        var playing = null, warmQueue = [], warming = false;

        function post(frame, method) {
            try { frame.contentWindow.postMessage(JSON.stringify({ method: method }), '*'); } catch (e) {}
        }

        function frameOf(media) { return media.querySelector('.reel-frame'); }

        function build(media, autoplay) {
            var id = media.getAttribute('data-vimeo');
            if (!id) return null;
            var hash = media.getAttribute('data-hash');   // unlisted videos carry one
            var frame = document.createElement('iframe');
            frame.className = 'reel-frame';
            frame.src = 'https://player.vimeo.com/video/' + id +
                        '?background=1&autoplay=' + (autoplay ? 1 : 0) + '&loop=1&muted=1&dnt=1&quality=540p' +
                        (hash ? '&h=' + hash : '');
            frame.setAttribute('frameborder', '0');
            frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
            frame.setAttribute('tabindex', '-1');
            frame.setAttribute('aria-hidden', 'true');
            frame.title = '';
            frame.style.setProperty('--va', media.getAttribute('data-va') || '1.778');
            frame.addEventListener('load', function () {
                frame.dataset.loaded = '1';
                // background=1 starts on its own; hold it until it is hovered
                post(frame, media === playing ? 'play' : 'pause');
            });
            media.appendChild(frame);
            return frame;
        }

        // warm one tile at a time so they do not all fight for the same connections
        function warm(media) {
            if (frameOf(media) || warmQueue.indexOf(media) !== -1) return;
            warmQueue.push(media);
            if (!warming) drain();
        }
        function drain() {
            var media = warmQueue.shift();
            if (!media) { warming = false; return; }
            warming = true;
            if (!frameOf(media)) build(media, false);
            setTimeout(drain, 250);
        }

        function reload(frame) {
            frame.dataset.reloaded = '1';
            frame.src = frame.src.replace('autoplay=0', 'autoplay=1');
        }

        function stop() {
            if (!playing) return;
            var frame = frameOf(playing);
            if (frame) post(frame, 'pause');
            playing.classList.remove('is-playing');
            playing = null;
        }

        function play(media) {
            if (media === playing) return;
            stop();
            var frame = frameOf(media);
            if (!frame) frame = build(media, true);      // not warmed yet: load it already playing
            else if (frame.dataset.loaded) post(frame, 'play');
            if (!frame) return;
            media.classList.add('is-playing');
            playing = media;
            // A warm player that will not start from a pause gets reloaded playing.
            // Asked after a beat: asking the instant after "play" reports paused
            // (play is async) and the reload made the clip visibly restart.
            if (frame.dataset.loaded && !frame.dataset.reloaded) setTimeout(function () {
                if (media !== playing) return;
                var answered = false;
                var onMsg = function (e) {
                    if (e.source !== frame.contentWindow) return;
                    try {
                        var d = JSON.parse(e.data);
                        if (d.method === 'getPaused') {
                            answered = true;
                            window.removeEventListener('message', onMsg);
                            if (d.value === true && media === playing) reload(frame);
                        }
                    } catch (err) {}
                };
                window.addEventListener('message', onMsg);
                post(frame, 'getPaused');
                setTimeout(function () {
                    window.removeEventListener('message', onMsg);
                    if (!answered && media === playing) reload(frame);
                }, 900);
            }, 600);
        }

        // Warm every tile, in order, one every 250ms. A paused background player
        // is light, and it means any tile the cursor lands on is already there.
        var warmAll = function () {
            document.querySelectorAll('.reel-media').forEach(warm);
        };
        warmAll();
        var target = document.getElementById('rosterContent');   // gated pages: tiles arrive after the unlock
        if (target) new MutationObserver(warmAll).observe(target, { childList: true });

        // Delegated, so it works on markup that only appears after the unlock.
        if (window.matchMedia && matchMedia('(hover: hover)').matches) {
            document.addEventListener('mouseover', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media) play(media);
            });
            document.addEventListener('mouseout', function (e) {
                var media = e.target.closest && e.target.closest('.reel-media');
                if (media && media === playing && !media.contains(e.relatedTarget)) stop();
            });
        }

        // A click opens the tile in the full-screen viewer (custom player, sound on).
        document.addEventListener('click', function (e) {
            var media = e.target.closest && e.target.closest('.reel-media');
            if (!media) return;
            e.preventDefault();
            var idx = Array.prototype.indexOf.call(document.querySelectorAll('.reel-media'), media);
            stop();
            if (typeof openViewer === 'function' && idx !== -1) openViewer(idx);
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) stop();
        });

        // The tab title is generic until the page is unlocked.
        new MutationObserver(function (records, obs) {
            var name = document.querySelector('.director-name');
            if (!name) return;
            document.title = name.textContent;
            obs.disconnect();
        }).observe(document.getElementById('rosterContent'), { childList: true });
    })();
    </script>
</body>
</html>
