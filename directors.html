    <script>
    // The loading screen shows once per tab session. Coming back to the home
    // from About, Contact or a director page skips it; the flag is set here,
    // before the overlay is even parsed, so there is no flash either way.
    (function () {
        try {
            if (sessionStorage.getItem('covalent.loader') === '1') {
                document.documentElement.classList.add('no-loader');
            } else {
                sessionStorage.setItem('covalent.loader', '1');
            }
        } catch (e) {}
    })();

    <style>

        /* CSS Variables */
        :root {
            /* One timing for every themed property, so nothing fades out of step. */
            --theme-transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease, -webkit-text-fill-color 300ms ease;
            --ice: #FAFBFC;
            --bond-blue: #5979e9;

        /* Video Background */
        .video-background {

        .video-wrapper {

            height: 100%;

        }

        /* Each reel iframe is sized to its clip's own aspect ratio (--va, set by
           the script) and then enlarged until it covers the viewport in both
           directions, like object-fit: cover. The clip itself therefore never
           letterboxes inside the player, so there are no bars on any screen
           shape. The 4% overscan hides the player's edge pixels. */
        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: max(100vw, calc(100vh * var(--va, 1.778)));
            height: max(100vh, calc(100vw / var(--va, 1.778)));
            width: max(100vw, calc(100dvh * var(--va, 1.778)));
            height: max(100dvh, calc(100vw / var(--va, 1.778)));
            transform: translate(-50%, -50%) scale(1.04);
            border: none;
            opacity: 0;
            /* every player is already running behind the names, so a hover is a
               hard cut to it, no fade */
            transition: none;
            pointer-events: none;
        }


        .video-wrapper iframe.active {
            opacity: 1;
        }

        .video-wrapper .director-poster {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; pointer-events: none; z-index: 1;

        .director-row {

        .director-name {

        /* ==================== */

        /* BRANDED SCROLLBAR — replaces the native macOS overlay scrollbar

<body>
    <!-- Loading screen: "loading..." as wide as the viewport, dots cycling
         1-2-3 until the first reel reports a painted frame (4s hard cap;
         CSS alone fades it after 5s if script fails). -->
    <div class="site-loader" id="siteLoader" aria-hidden="true">
        <div class="site-loader-text" id="siteLoaderText">loading<span class="site-loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
    <script>
    // size the word to the viewport before anything else loads
    (function () {
        var t = document.getElementById('siteLoaderText');
        if (!t) return;
        function fit() {
            var w = document.documentElement.clientWidth - 24;
            t.style.fontSize = '100px';
            var tw = t.getBoundingClientRect().width;
            if (tw > 0) t.style.fontSize = (100 * w / tw) + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
    })();
    </script>

    <script>
        // Directors data
        // va = the clip's own aspect ratio; the iframe is sized to it so it covers the
        // viewport with no bars, whatever shape the window is
        const directors = [
            { id: 'cam',   slug: 'cam-erickson', name: 'Cam Erickson', vimeo: '1223839056', va: 1.778, thumbnail: 'https://i.vimeocdn.com/video/2197157994-d2f75b57e2db1ff54e3af79907b2c0f9c67e699873a20789d879f1bcbe78878f-d_1280x720' },
            { id: 'jacob', slug: 'jacob-frost',  name: 'Jacob Frost',  vimeo: '1170741864', va: 1.778, thumbnail: 'https://i.vimeocdn.com/video/2129989125-7bcea3f611dc90b29683cb79b07503543d01abd6db34091368cc53005941e0e5-d_1280x720' },
            { id: 'max',   slug: 'max-gilberg',  name: 'Max Gilberg',  vimeo: '1222196280', va: 1.333, thumbnail: 'https://i.vimeocdn.com/video/2195092897-9a6785a8fe877ac952a8b7f731dd95660a7d5889dd56aad19942dbe267a083b1-d_1280x720' },
            { id: 'noah',  slug: 'noah-keckler', name: 'Noah Keckler', vimeo: '1164768847', va: 1.778, thumbnail: 'https://i.vimeocdn.com/video/2121554252-a7004843031d0a0efd0bbbf00cf82995c6b3caf2edaa5224a6466ed1c6918a0c-d_1280x720' }
        ];

        const videoWrapper = document.getElementById('videoWrapper');
        const directorRows = document.querySelectorAll('.director-row');
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        // Mark directors without video
        directorRows.forEach(row => {
            const directorId = row.getAttribute('data-director');
            const director = directors.find(d => d.id === directorId);
            if (!director || (!director.vimeo && !director.youtube)) {
                row.classList.add('no-video');
            }
        });

        // Create video iframes lazily — only the first one upfront, others on demand
        function createVideoElement(director) {
            const iframe = document.createElement('iframe');
            iframe.setAttribute('data-director', director.id);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('loading', 'eager');
            // ask the player to report play/pause; the poster comes off on the
            // first real frame, not when the player document happens to load
            iframe.addEventListener('load', () => {
                iframe.dataset.loaded = '1';
                subscribe(iframe);
            });

            if (director.vimeo) {
                iframe.src = `https://player.vimeo.com/video/${director.vimeo}?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&loop=1&muted=1&controls=0&background=1&dnt=1&quality=720p`;
            } else if (director.youtube) {
                iframe.src = `https://www.youtube.com/embed/${director.youtube}?autoplay=1&loop=1&muted=1&controls=0&showinfo=0&rel=0&modestbranding=1&playlist=${director.youtube}&playsinline=1`;
            }

            iframe.style.setProperty('--va', director.va || 1.778);

            return iframe;
        }

        // Ensure an iframe exists for a given director — creates lazily, returns the iframe
        function ensureVideo(directorId) {
            let iframe = videoWrapper.querySelector(`iframe[data-director="${directorId}"]`);
            if (iframe) return iframe;
            const director = directors.find(d => d.id === directorId);
            if (!director || (!director.vimeo && !director.youtube)) return null;
            ensurePoster(directorId);
            iframe = createVideoElement(director);
            videoWrapper.appendChild(iframe);
            return iframe;
        }

        // ---- talking to the players ----
        // Vimeo's embed answers postMessage: we subscribe each player to its own
        // play/pause events, keep the poster up until the first real frame, and
        // park every player that is not on screen so only one stream runs.
        function post(iframe, method, value) {
            try {
                iframe.contentWindow.postMessage(JSON.stringify(
                    value === undefined ? { method } : { method, value }), 'https://player.vimeo.com');
            } catch (e) {}
        }
        function subscribe(iframe) {
            post(iframe, 'addEventListener', 'play');
            post(iframe, 'addEventListener', 'pause');
            // either of these means frames are actually being painted
            post(iframe, 'addEventListener', 'playing');
            post(iframe, 'addEventListener', 'timeupdate');
        }
        const parkTimers = {};
        function park(iframe) {
            clearTimeout(parkTimers[iframe.dataset.director]);
            if (iframe.dataset.director !== currentVideoId) post(iframe, 'pause');
        }
        function iframeFor(source) {
            return Array.from(videoWrapper.querySelectorAll('iframe')).find(f => f.contentWindow === source) || null;
        }
        window.addEventListener('message', (e) => {
            if (e.origin !== 'https://player.vimeo.com') return;
            let data; try { data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
            const iframe = iframeFor(e.source);
            if (!iframe) return;
            if (data.event === 'ready') subscribe(iframe);
            if (data.event === 'play') {
                iframe.dataset.playing = '1';
                // off screen: let it paint a frame, then park it (hover resumes it
                // instantly). If no frame event ever comes, park after 600ms anyway.
                if (iframe.dataset.director !== currentVideoId) {
                    clearTimeout(parkTimers[iframe.dataset.director]);
                    parkTimers[iframe.dataset.director] = setTimeout(() => park(iframe), 600);
                }
            }
            if ((data.event === 'playing' || data.event === 'timeupdate') && !iframe.dataset.hasFrame) {
                iframe.dataset.hasFrame = '1';   // a real frame is on screen now
                post(iframe, 'removeEventListener', 'timeupdate');
                post(iframe, 'removeEventListener', 'playing');
                if (iframe.dataset.director === currentVideoId) {
                    hidePoster(iframe.dataset.director);
                    if (!firstFramePainted) { firstFramePainted = true; loadRest(); loaderDone(); }
                } else {
                    park(iframe);
                }
            }
            if (data.event === 'pause') {
                iframe.dataset.playing = '';
                // A player parked a moment before it was hovered must start again.
                // Bounded, so a browser that refuses playback (background tab)
                // cannot bounce play/pause forever.
                const tries = +(iframe.dataset.replays || 0);
                if (iframe.dataset.director === currentVideoId && document.visibilityState === 'visible' && tries < 2) {
                    iframe.dataset.replays = String(tries + 1);
                    post(iframe, 'play');
                }
            }
        });

        // ---- posters: blurred still that covers a player until it is playing ----
        let posterTimer = null;
        function ensurePoster(directorId) {
            let img = videoWrapper.querySelector(`.director-poster[data-director="${directorId}"]`);
            if (img) return img;
            const d = directors.find(x => x.id === directorId);
            if (!d || !d.thumbnail) return null;
            img = document.createElement('img');
            img.className = 'director-poster';
            img.setAttribute('data-director', d.id);
            img.src = d.thumbnail;
            img.width = 1280; img.height = 720; img.alt = ''; img.decoding = 'async';
            videoWrapper.appendChild(img);
            return img;
        }
        function hidePoster(directorId) {
            clearTimeout(posterTimer);
            const p = videoWrapper.querySelector(`.director-poster[data-director="${directorId}"]`);
            if (p && p.style.opacity === '1') {
                p.style.transition = 'opacity 0.5s ease';
                p.style.opacity = '0';
            }
        }

        // ---- load order ----
        // The first reel gets the whole connection to itself. The others are
        // created one at a time once it is on screen (or after 1.5s if the
        // player never says so), autoplay, and park themselves on first frame.
        // ---- loading screen ----
        const loader = document.getElementById('siteLoader');
        let loaderFinished = false;
        function loaderDone() {
            if (loaderFinished || !loader) return;
            loaderFinished = true;
            loader.classList.add('is-done');               // overlay fades
            setTimeout(() => loader.remove(), 600);
        }
        if (loader) {
            setTimeout(loaderDone, 4000);                                     // never hold the page longer
            window.addEventListener('pageshow', (e) => { if (e.persisted) loaderDone(); });
        }

        let firstFramePainted = false, restLoaded = false;
        function loadRest() {
            if (restLoaded) return;
            restLoaded = true;
            const rest = directors.filter(d => (d.vimeo || d.youtube) && d.id !== directors[0].id);
            rest.forEach((d, i) => setTimeout(() => { ensurePoster(d.id); ensureVideo(d.id); }, i * 450));
        }
        setTimeout(loadRest, 1500);

        // Switch video with crossfade
        let currentVideoId = null;
        let switchTimer = null;

        function switchVideo(directorId) {
            const director = directors.find(d => d.id === directorId);

            if (!director || (!director.vimeo && !director.youtube)) {
                return;
            }

            if (directorId === currentVideoId) return;

            const leaving = currentVideoId && videoWrapper.querySelector(`iframe[data-director="${currentVideoId}"]`);
            currentVideoId = directorId;
            videoWrapper.querySelectorAll('iframe').forEach(f => { f.dataset.replays = '0'; });

            // Lazy-create the iframe on first hover (after that it's cached in the DOM)
            const newIframe = ensureVideo(directorId);

            // Only one stream at a time: park the reel we are leaving, wake the
            // one we are landing on (parked players resume from their buffer).
            if (leaving && leaving !== newIframe) post(leaving, 'pause');
            if (newIframe && newIframe.dataset.loaded && !newIframe.dataset.playing) post(newIframe, 'play');

            // The blurred poster covers a player that has never shown a frame.
            // A parked player already holds a frame, so it cuts in bare and resumes.
            clearTimeout(posterTimer);
            videoWrapper.querySelectorAll('.director-poster').forEach(p => {
                p.style.transition = 'none';
                p.style.opacity = '0';
            });
            if (!newIframe || !newIframe.dataset.hasFrame) {
                const newPoster = ensurePoster(directorId);
                if (newPoster) {
                    newPoster.style.transition = 'none';
                    newPoster.style.opacity = '1';
                    // safety net if the player never reports a frame
                    posterTimer = setTimeout(() => hidePoster(directorId), 6000);
                }
            }

            // True crossfade: remove active from all, add to new one simultaneously
            // CSS transition handles the fade — no black gap
            const iframes = videoWrapper.querySelectorAll('iframe');
            iframes.forEach(iframe => iframe.classList.remove('active'));
            if (newIframe) {
                newIframe.classList.add('active');
            }

            directorRows.forEach(row => row.classList.remove('active'));
            const activeRow = document.querySelector(`.director-row[data-director="${directorId}"]`);
            if (activeRow) {
                activeRow.classList.add('active');
            }
        }

        // Hover and click listeners with debounce
        directorRows.forEach(row => {
            // Touch: tap to switch video (mouseenter doesn't fire on mobile)
            row.addEventListener('touchstart', (e) => {
                const directorId = row.getAttribute('data-director');
                switchVideo(directorId);
            }, { passive: true });

            // no debounce: the moment the cursor lands on a name, its reel is up
            row.addEventListener('mouseenter', () => {
                switchVideo(row.getAttribute('data-director'));
            });

            row.addEventListener('click', () => {
                const directorId = row.getAttribute('data-director');
                const director = directors.find(d => d.id === directorId);

                if (director) {
                    window.location.href = '/' + director.id;
                }
            });
        });

        // Set initial video immediately
        const firstDirectorWithVideo = directors.find(d => d.vimeo || d.youtube);
        if (firstDirectorWithVideo) {
            switchVideo(firstDirectorWithVideo.id);
        }

        // Menu toggle
        menuToggle && menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        // Close menu when clicking outside
        menuOverlay && menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // Close menu on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (menuOverlay && menuOverlay.classList.contains('active'))) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // ==================== //
        // MENU LINK GRADIENT SPREAD EFFECT
        // ==================== //
        // (menu hover handled by CSS only)

        // Custom cursor + idle detection
        const cursor = document.getElementById('cursor');
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            cursor.style.display = 'none';
        }
        const directorsContainer = document.querySelector('.directors-container');
        let idleTimer;
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Show text on mouse move
            directorsContainer.classList.remove('idle');

            // Reset idle timer
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                directorsContainer.classList.add('idle');
            }, 3000);
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.35;
            cursorY += (mouseY - cursorY) * 0.35;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // ==================== //
        // VIRUS SPREADING TEXT EFFECT (footer)
        // ==================== //
        const virusLinks = document.querySelectorAll('.footer-link');

        virusLinks.forEach(link => {
            const text = link.textContent;
            link.textContent = '';

            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const char = document.createElement('span');
                char.className = 'char';
                char.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                link.appendChild(char);
                chars.push(char);
            }

            let isInfected = false;

            link.addEventListener('mouseenter', (e) => {
                if (isInfected) return;
                isInfected = true;

                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => a.distance - b.distance);

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.add('infected');
                        if (i === charDistances.length - 1) {
                            link.classList.add('fully-infected');
                        }
                    }, i * 30);
                });
            });

            link.addEventListener('mouseleave', (e) => {
                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => b.distance - a.distance);
                link.classList.remove('fully-infected');

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.remove('infected');
                        if (i === charDistances.length - 1) {
                            isInfected = false;
                        }
                    }, i * 25);
                });
            });
        });
    </script>

                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });

        })();

    <script>
    // Re-enforce cursor:none via injected stylesheet (bfcache-safe)
    (function() {
        function enforceNoCursor() {
            var existing = document.getElementById('no-native-cursor');
            if (existing) existing.remove();
            var style = document.createElement('style');
            style.id = 'no-native-cursor';
            style.textContent = 'html, html *, body, body * { cursor: none !important; }';
            document.head.appendChild(style);
        }
        enforceNoCursor();
        window.addEventListener('pageshow', function(e) {
            enforceNoCursor();
            var cursor = document.getElementById('cursor');
            if (cursor && !('ontouchstart' in window)) {
                cursor.style.display = 'block';
            }
        });
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) enforceNoCursor();
        });
    })();
    </script>
