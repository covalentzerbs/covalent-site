    <style>
        /* ==================== */
        /* CSS VARIABLES */
        /* ==================== */
        :root {
            /* One timing for every themed property, so nothing fades out of step. */
            --theme-transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease, -webkit-text-fill-color 300ms ease;
            --black: #0A0A0A;
            --white: #FFFFFF;
            --gray: #6B7280;
            --bond-blue: #5979e9;
        }

        /* ==================== */
        /* RESET & BASE */
        /* ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        ::selection {
            background: var(--black);
            color: var(--white);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--black);
            text-transform: lowercase;
            letter-spacing: -0.04em;
        }

        /* ==================== */
        /* CUSTOM CURSOR */
        /* ==================== */
        .cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--white);
            pointer-events: none;
            z-index: 99999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .cursor.hidden {
            opacity: 0;
        }

        /* ==================== */
        /* NAVIGATION - PLUS MENU */
        /* ==================== */
        .nav {
            position: fixed;
            top: 0;
            right: 0;
            padding: 2rem;
            z-index: 1000;
        }

        /* Top-right nav: About and Contact stacked, small, in place of the old plus menu */
        .nav { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
        .nav-link {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--black);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .nav-link:hover, .nav-link.current { opacity: 1; }
        .nav-link:hover { color: #FF4500; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link { color: #FF4500 !important; -webkit-text-fill-color: #FF4500; }
        body.dark-mode .nav-link:hover { color: #FFFFFF !important; -webkit-text-fill-color: #FFFFFF; }

        .menu-toggle {
            width: 48px;
            height: 48px;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-toggle.active {
            transform: rotate(45deg);
        }

        .plus-icon {
            width: 22px;
            height: 22px;
            position: relative;
        }

        .plus-icon span {
            display: block;
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--black);
            top: 50%;
            left: 0;
            transition: all 0.3s ease;
        }

        .plus-icon span:first-child {
            transform: translateY(-50%) rotate(90deg);
        }

        .plus-icon span:last-child {
            transform: translateY(-50%);
        }

        /* ==================== */
        /* MENU OVERLAY */
        /* ==================== */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-end;
            padding: 7rem 3rem 3rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .menu-overlay.active {
            pointer-events: auto;
            opacity: 1;
        }

        .menu-links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-link {
            font-size: clamp(1rem, 1.8vw, 1.5rem);
            font-weight: 700;
            color: var(--black);
            text-decoration: none;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.07em;
            line-height: 1.1;
        }

        .menu-overlay.active .menu-link {
            opacity: 0.6;
            transform: translateX(0);
        }

        .menu-overlay.active .menu-link:nth-child(1) { transition-delay: 0.05s; }
        .menu-overlay.active .menu-link:nth-child(2) { transition-delay: 0.1s; }
        .menu-overlay.active .menu-link:nth-child(3) { transition-delay: 0.15s; }
        .menu-overlay.active .menu-link:nth-child(4) { transition-delay: 0.2s; }

        .menu-link:hover {
            opacity: 1 !important;
        }

        .menu-link {
            position: relative;
            display: inline-block;
        }

        .menu-link-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #5979e9, #7B93FF, #5979e9, #3A5BD4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            opacity: 0;
            transition: opacity 0s;
        }

        .menu-link:hover .menu-link-gradient {
            opacity: 1;
        }

        /* ==================== */
        /* MAIN CONTENT LAYOUT */
        /* ==================== */
        .page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 3rem;
            padding: 6rem 3rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ==================== */
        /* VIDEO PLAYER SECTION */
        /* ==================== */
        .video-section {
            position: relative;
        }

        .cs-video-hero {
            position: relative;
            width: 100%;
        }

        .cs-video-ratio {
            position: relative;
            background: transparent;
            border-radius: 2px;
            overflow: hidden;
        }

        .cs-video-ratio iframe {
            display: block;
            width: 100%;
            border: none;
        }

        /* Click layer for play/pause */
        .cs-video-click-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: none;
            background: transparent;
        }

        /* ==================== */
        /* CUSTOM VIDEO CONTROLS */
        /* ==================== */
        .cs-video-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 24px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--white);
            z-index: 20;
            opacity: 1;
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        /* Auto-hide when playing */
        .cs-video-hero.cs-playing .cs-video-controls {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .cs-video-hero.cs-playing.cs-hover .cs-video-controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Idle state — controls slide down */
        .cs-video-hero.cs-idle .cs-video-controls {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* When mouse moves again — snap back up */
        .cs-video-hero:not(.cs-idle) .cs-video-controls {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
        }

        /* Hide cursor when idle */
        .cs-video-hero.cs-idle {
            cursor: none !important;
        }

        .cs-video-hero.cs-idle .cs-video-click-layer {
            cursor: none !important;
        }

        /* Control buttons */
        .cs-ctrl {
            border: none;
            background: transparent;
            color: inherit;
            cursor: none;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.3s ease;
        }

        .cs-ctrl:hover {
            filter: brightness(0) saturate(100%) invert(47%) sepia(98%) saturate(456%) hue-rotate(194deg) brightness(95%) contrast(91%);
        }

        .cs-ctrl-icon {
            width: 16px;
            height: auto;
            pointer-events: none;
            transition: filter 0.3s ease;
        }

        .cs-icon-play { display: inline-block; }
        .cs-icon-pause { display: none; }

        .cs-video-hero.cs-playing .cs-icon-play { display: none; }
        .cs-video-hero.cs-playing .cs-icon-pause { display: inline-block; }

        /* Progress bar */
        .cs-progress {
            flex: 1;
            cursor: none;
            padding: 10px 0;
        }

        .cs-progress-track {
            position: relative;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.5);
            border-radius: 999px;
            overflow: hidden;
        }

        .cs-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: var(--white);
            border-radius: 999px;
        }

        /* Timecode */
        .cs-time {
            font-family: 'Helvetica Neue', 'HelveticaNeue', Helvetica, Arial, sans-serif;
            letter-spacing: -0.07em;
            font-size: 12px;
            opacity: 1;
            white-space: nowrap;
        }

        /* ==================== */
        /* FULLSCREEN MODE */
        /* ==================== */
        /* Restore cursor in fullscreen */
        :fullscreen, :fullscreen * {
            cursor: auto !important;
        }

        :fullscreen .cursor {
            display: none !important;
        }

        .cs-video-ratio:fullscreen {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--black);
            width: 100vw;
            height: 100vh;
        }

        .cs-video-ratio:fullscreen #vimeoWrapper {
            width: 100%;
            height: 100%;
            padding-top: 0 !important;
            position: relative !important;
        }

        .cs-video-ratio:fullscreen #vimeoWrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .cs-video-ratio:fullscreen .cs-video-controls {
            position: fixed;
            bottom: 40px;
            left: 60px;
            right: 60px;
            padding: 0;
        }

        /* Always show controls in fullscreen on hover */
        .cs-video-ratio:fullscreen .cs-video-hero.cs-playing .cs-video-controls {
            opacity: 0;
            pointer-events: none;
        }

        .cs-video-ratio:fullscreen:hover .cs-video-controls {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .cs-video-ratio:fullscreen .cs-video-hero:not(.cs-idle) .cs-video-controls {
            opacity: 1 !important;
            transform: translateY(0) !important;
            pointer-events: auto !important;
        }

        .cs-video-ratio:fullscreen .cs-video-hero.cs-idle .cs-video-controls {
            opacity: 0 !important;
            transform: translateY(20px) !important;
            pointer-events: none !important;
        }

        /* Hide system cursor when idle in fullscreen */
        .cs-video-ratio:fullscreen .cs-video-hero.cs-idle,
        .cs-video-ratio:fullscreen .cs-video-hero.cs-idle * {
            cursor: none !important;
        }

        /* ==================== */
        /* PROJECT INFO SECTION */
        /* ==================== */
        .project-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0;
        }

        .project-meta {
            margin-bottom: 1.5rem;
        }

        .director-credit {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.07em;
            margin-bottom: 1rem;
        }

        .case-study-link {
            display: inline-block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--black);
            text-decoration: none;
            position: relative;
        }

        .case-study-link::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            right: -0.15em;
            bottom: -0.15em;
            background: linear-gradient(90deg, #5979e9, #7B93FF, #5979e9, #3A5BD4);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
            mask-image: radial-gradient(circle at var(--mx, 0px) var(--my, 0px), black var(--spread, 0%), transparent var(--spread, 0%));
        }

        /* Underline */
        .case-study-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--black);
            transform-origin: left;
        }

        

        /* ==================== */
        /* LOGO BOTTOM RIGHT */
        /* ==================== */
        .logo-bottom {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .logo-bottom:hover { opacity: 1; }
        .logo-bottom:hover svg path { fill: #FF4500; }

        .logo-bottom svg {
            width: 40px;
            height: 40px;
        }

        .logo-bottom svg path {
            fill: var(--black); transition: fill 0.2s ease;
        }

        /* ==================== */
        /* RESPONSIVE */
        /* ==================== */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 5rem 2.5rem 2.5rem;
            }

            .project-info {
                padding: 1rem 0;
            }

            .nav {
                padding: 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

        }

        @media (max-width: 768px) {
            .main-content {
                padding: 4rem 1.5rem 1.5rem;
            }

            .nav {
                padding: 1.5rem;
            }

            .logo-bottom {
                top: 1.5rem;
                left: 1.5rem;
            }

            .logo-bottom svg {
                width: 32px;
                height: 32px;
            }

            .cs-video-controls {
                padding: 0 16px;
                bottom: 16px;
            }
        }
        /* ==================== */
        /* DARK MODE OVERRIDES */
        /* ==================== */
        body.dark-mode {
            background-color: #0A0A0A !important;
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode ::selection {
            background: #FF4500 !important;
            color: #0A0A0A !important;
            -webkit-text-fill-color: #0A0A0A !important;
        }

        body.dark-mode .cursor {
            background: #FF4500 !important;
        }

        body.dark-mode .plus-icon span {
            background: #FF4500 !important;
        }

        body.dark-mode .menu-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .logo-bottom svg path {
            fill: #FF4500 !important;
        }
        body.dark-mode .logo-bottom:hover svg path { fill: #FFFFFF !important; }

        body.dark-mode .contact-email {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .clock-row {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .about-text {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-client {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .project-subtitle {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .scroll-progress-segment {
            background: #FF4500 !important;
        }

        body.dark-mode .director-name {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .director-credit {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link {
            color: #FF4500 !important;
            -webkit-text-fill-color: #FF4500;
        }

        body.dark-mode .case-study-link::after {
            background: #FF4500 !important;
        }

        body.dark-mode .hero-logo svg path {
            fill: #FF4500 !important;
        }

        /* ==================== */
        /* DARK MODE TOGGLE */
        /* ==================== */
        

        /* Theme switch: a short cross-fade instead of a hard cut. The class is
           only on <body> for the duration of the fade, so it never fights the
           site's own transitions the rest of the time. */
        body.theme-fading,
        body.theme-fading *,
        body.theme-fading *::before,
        body.theme-fading *::after {
            transition: var(--theme-transition) !important;
        }
    </style>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>

    <!-- Vimeo Player API -->
    <script src="https://player.vimeo.com/api/player.js"></script>

    <script>
        // ==================== //
        // CUSTOM CURSOR
        // ==================== //
        const cursor = document.getElementById('cursor');
        const vimeoWrapperEl = document.getElementById('vimeoWrapper');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.35;
            cursorY += (mouseY - cursorY) * 0.35;
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Hide cursor when over video area (Vimeo has its own cursor)
        vimeoWrapperEl.addEventListener('mouseenter', () => {
            cursor.classList.add('hidden');
        });

        vimeoWrapperEl.addEventListener('mouseleave', () => {
            cursor.classList.remove('hidden');
        });

        // ==================== //
        // MENU TOGGLE
        // ==================== //
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        menuToggle && menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        });

        menuOverlay && menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && (menuOverlay && menuOverlay.classList.contains('active'))) {
                menuToggle.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        });

        // ==================== //
        // MENU LINK GRADIENT SPREAD EFFECT
        // ==================== //
        document.querySelectorAll('.menu-link').forEach(link => {
            const gradient = document.createElement('span');
            gradient.classList.add('menu-link-gradient');
            gradient.textContent = link.textContent;
            gradient.style.setProperty('--spread', '0%');
            link.appendChild(gradient);

            let animationFrame;

            link.addEventListener('mouseenter', (e) => {
                const rect = link.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                gradient.style.setProperty('--mx', x + 'px');
                gradient.style.setProperty('--my', y + 'px');
                gradient.style.setProperty('--spread', '0%');

                let start = null;
                const duration = 900;
                const animate = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    gradient.style.setProperty('--spread', (eased * 200) + '%');
                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    }
                };
                cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(animate);
            });

            link.addEventListener('mouseleave', () => {
                cancelAnimationFrame(animationFrame);
                let start = null;
                const currentSpread = parseFloat(gradient.style.getPropertyValue('--spread')) || 200;
                const duration = 500;
                const animate = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    gradient.style.setProperty('--spread', (currentSpread * (1 - eased)) + '%');
                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    }
                };
                animationFrame = requestAnimationFrame(animate);
            });
        });

        // ==================== //
        // VIMEO PLAYER CONTROLS
        // ==================== //
        const iframe = document.getElementById('vimeoPlayer');
        const player = new Vimeo.Player(iframe);
        const vimeoWrapper = document.getElementById('vimeoWrapper');

        const videoHero = document.getElementById('videoHero');
        const videoClickLayer = document.getElementById('videoClickLayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        let isPlaying = false;
        let videoDuration = 0;

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Get video duration and set aspect ratio
        player.getDuration().then(duration => {
            videoDuration = duration;
            durationEl.textContent = formatTime(duration);
        });

        // Get actual video dimensions and set aspect ratio
        Promise.all([player.getVideoWidth(), player.getVideoHeight()]).then(([width, height]) => {
            const aspectRatio = (height / width) * 100;
            vimeoWrapper.style.paddingTop = aspectRatio + '%';
        });

        // Play/Pause toggle
        function togglePlay() {
            if (isPlaying) {
                player.pause();
            } else {
                player.play();
            }
        }

        videoClickLayer.addEventListener('click', togglePlay);
        playPauseBtn.addEventListener('click', togglePlay);

        // Update playing state
        player.on('play', () => {
            isPlaying = true;
            videoHero.classList.add('cs-playing');
        });

        player.on('pause', () => {
            isPlaying = false;
            videoHero.classList.remove('cs-playing');
        });

        // Update progress bar
        player.on('timeupdate', (data) => {
            const percent = (data.seconds / videoDuration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(data.seconds);
        });

        // Seek on progress bar click
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            const seekTime = percent * videoDuration;
            player.setCurrentTime(seekTime);
        });

        // Fullscreen toggle - fullscreen the container to keep custom controls
        const videoRatio = document.getElementById('videoRatio');

        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                videoRatio.requestFullscreen();
            }
        });

        // Hover detection for controls visibility
        videoHero.addEventListener('mouseenter', () => {
            videoHero.classList.add('cs-hover');
        });

        videoHero.addEventListener('mouseleave', () => {
            videoHero.classList.remove('cs-hover');
            videoHero.classList.remove('cs-idle');
            clearTimeout(idleTimeout);
        });

        // Idle detection — hide controls after 1s of no mouse movement
        let idleTimeout;

        videoHero.addEventListener('mousemove', () => {
            videoHero.classList.remove('cs-idle');
            clearTimeout(idleTimeout);
            if (isPlaying) {
                idleTimeout = setTimeout(() => {
                    videoHero.classList.add('cs-idle');
                }, 1000);
            }
        });

        // Start idle timer when video starts playing (if already hovering)
        player.on('play', () => {
            if (videoHero.classList.contains('cs-hover')) {
                clearTimeout(idleTimeout);
                idleTimeout = setTimeout(() => {
                    videoHero.classList.add('cs-idle');
                }, 1000);
            }
        });

        // Remove idle state when video pauses
        player.on('pause', () => {
            videoHero.classList.remove('cs-idle');
            clearTimeout(idleTimeout);
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !(menuOverlay && menuOverlay.classList.contains('active'))) {
                e.preventDefault();
                togglePlay();
            }
            // Escape exits fullscreen (browser handles this natively, but just in case)
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // ==================== //
        // GRADIENT SPREAD EFFECT (case study link)
        // ==================== //
        document.querySelectorAll('.case-study-link').forEach(link => {
            link.setAttribute('data-text', link.textContent);

            let animationFrame;

            link.addEventListener('mouseenter', (e) => {
                const rect = link.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                link.style.setProperty('--mx', x + 'px');
                link.style.setProperty('--my', y + 'px');
                link.style.setProperty('--spread', '0%');

                let start = null;
                const duration = 1400;
                const animate = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    link.style.setProperty('--spread', (eased * 200) + '%');
                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    }
                };
                cancelAnimationFrame(animationFrame);
                animationFrame = requestAnimationFrame(animate);
            });

            link.addEventListener('mouseleave', () => {
                cancelAnimationFrame(animationFrame);
                const currentSpread = parseFloat(link.style.getPropertyValue('--spread')) || 200;

                let start = null;
                const duration = 700;
                const animate = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    link.style.setProperty('--spread', (currentSpread * (1 - eased)) + '%');
                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    }
                };
                animationFrame = requestAnimationFrame(animate);
            });
        });

        // ==================== //
        // VIRUS SPREADING TEXT EFFECT (footer)
        // ==================== //
        const virusLinks = document.querySelectorAll('.footer-link');

        virusLinks.forEach(link => {
            const text = link.textContent;
            link.textContent = '';

            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const char = document.createElement('span');
                char.className = 'char';
                char.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                link.appendChild(char);
                chars.push(char);
            }

            let isInfected = false;

            link.addEventListener('mouseenter', (e) => {
                if (isInfected) return;
                isInfected = true;

                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => a.distance - b.distance);

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.add('infected');
                    }, i * 30);
                });
            });

            link.addEventListener('mouseleave', (e) => {
                const rect = link.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const charDistances = chars.map((char, index) => {
                    const charRect = char.getBoundingClientRect();
                    const charCenterX = charRect.left - rect.left + charRect.width / 2;
                    const charCenterY = charRect.top - rect.top + charRect.height / 2;
                    const distance = Math.sqrt(
                        Math.pow(charCenterX - mouseX, 2) +
                        Math.pow(charCenterY - mouseY, 2)
                    );
                    return { char, distance, index };
                });

                charDistances.sort((a, b) => b.distance - a.distance);

                charDistances.forEach((item, i) => {
                    setTimeout(() => {
                        item.char.classList.remove('infected');
                        if (i === charDistances.length - 1) {
                            isInfected = false;
                        }
                    }, i * 25);
                });
            });
        });
    </script>


    <script>
        // ==================== //
        // DARK MODE TOGGLE
        // ==================== //
        (function() {
            const toggle = document.getElementById('darkModeToggle');
            const isDark = localStorage.getItem('darkMode') === 'true';
            if (isDark) {
                document.body.classList.add('dark-mode');
                toggle.checked = true;
            }
            toggle.addEventListener('change', () => {
                document.body.classList.add('theme-fading'); clearTimeout(window.__themeFadeT); window.__themeFadeT = setTimeout(function(){ document.body.classList.remove('theme-fading'); }, 360); document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });

            // Cursor inflate on toggle hover
            const cursorEl = document.getElementById('cursor');
            const toggleLabel = document.querySelector('.dark-mode-toggle');
            toggleLabel.addEventListener('mouseenter', () => {
                cursorEl.style.transform = 'translate(-50%, -50%) scale(1.8)';
                cursorEl.style.transition = 'transform 0.2s ease, left 0s, top 0s';
            });
            toggleLabel.addEventListener('mouseleave', () => {
                cursorEl.style.transform = 'translate(-50%, -50%) scale(1)';
                cursorEl.style.transition = 'transform 0.2s ease, left 0s, top 0s';
            });
        })();
    </script>
    <script src="../scripts/analytics.js"></script>
