<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <!-- Preheader: the grey line inbox previews show after the subject -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#0A0A0A;">
          <tr>
            <td style="padding-bottom:32px;">
              <a href="https://covalentstudios.co" style="text-decoration:none;">
                <img src="https://covalentstudios.co/assets/logos/covalent_logomark_black.svg" width="32" height="32" alt="Covalent Studios" style="display:block;border:0;">
              </a>
            </td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.6;">
              {{content}}
            </td>
          </tr>
          <tr>
            <td style="padding-top:48px;font-size:11px;line-height:1.6;color:#0A0A0A;opacity:0.5;">
              2026, Covalent Studios<br>
              <a href="https://covalentstudios.co" style="color:#0A0A0A;">covalentstudios.co</a>
              &nbsp;·&nbsp;
              <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#0A0A0A;">Unsubscribe</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
